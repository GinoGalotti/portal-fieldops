<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P.O.R.T.A.L — CAMPBELL Priority Queue</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../briefing.css">
<style>

/* ── TOP BAR ── */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: 860px;
  margin: 0 auto 48px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
  font-size: 0.65rem;
  letter-spacing: 0.15em;
}
.top-bar a {
  color: var(--text-dim);
  text-decoration: none;
  transition: color 0.15s;
}
.top-bar a:hover { color: var(--green); }
.top-bar .campbell-id {
  color: var(--green-dim);
  display: flex;
  align-items: center;
  gap: 6px;
}
.top-bar .campbell-id .blink {
  display: inline-block;
  width: 6px; height: 6px;
  background: var(--green-dim);
  border-radius: 50%;
  animation: blink 1.4s step-end infinite;
}

/* ── WEEK SWITCHER ── */
.week-switcher {
  max-width: 860px;
  margin: 0 auto 48px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}
.sw-label {
  font-size: 0.6rem;
  letter-spacing: 0.25em;
  color: var(--text-dim);
}
.week-tabs {
  display: flex;
  gap: 2px;
  flex-wrap: wrap;
  justify-content: center;
}
.week-tab {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.2em;
  padding: 7px 22px;
  border: 1px solid var(--border-bright);
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.15s;
}
.week-tab:hover {
  border-color: var(--green-dim);
  color: var(--green);
}
.week-tab.active {
  border-color: var(--green);
  background: rgba(111,207,111,0.06);
  color: var(--green);
}
.week-tab.status-active::after {
  content: ' ●';
  color: var(--green);
  font-size: 0.5rem;
  vertical-align: middle;
}

/* ── CONTENT AREA ── */
#briefing-content {
  min-height: 200px;
}

/* ── LOADING STATE ── */
.loading {
  max-width: 860px;
  margin: 60px auto;
  text-align: center;
  color: var(--text-dim);
  font-size: 0.72rem;
  letter-spacing: 0.25em;
  animation: blink 1.4s step-end infinite;
}

/* ── ERROR STATE ── */
.load-error {
  max-width: 860px;
  margin: 60px auto;
  text-align: center;
  color: var(--red);
  font-size: 0.7rem;
  letter-spacing: 0.2em;
  border: 1px solid var(--red-dim);
  padding: 20px;
}

</style>
</head>
<body>

<div class="top-bar">
  <a href="../index.html">← PORTAL ARCHIVE</a>
  <div class="campbell-id">
    <span class="blink"></span>
    CAMPBELL ONLINE
  </div>
</div>

<div class="week-switcher">
  <div class="sw-label">// CAMPBELL — PRIORITY QUEUE · SELECT TRANSMISSION WINDOW</div>
  <div class="week-tabs" id="week-tabs">
    <!-- tabs injected by JS from briefings/index.json -->
  </div>
</div>

<div id="briefing-content">
  <div class="loading">// INITIALISING TRANSMISSION...</div>
</div>

<script>
(function () {
  var cache = {};
  var activeId = null;
  var weeks = [];

  // Generate a consistent fake CAMPBELL version per page load
  var ver = '2.' + (Math.floor(Math.random() * 9) + 1) + '.' + (Math.floor(Math.random() * 89) + 10);

  function fillVer(container) {
    container.querySelectorAll('.ver').forEach(function (el) {
      el.textContent = ver;
    });
  }

  function showContent(html) {
    var content = document.getElementById('briefing-content');
    content.innerHTML = html;
    fillVer(content);
  }

  function showLoading() {
    document.getElementById('briefing-content').innerHTML =
      '<div class="loading">// FETCHING TRANSMISSION...</div>';
  }

  function showError(id) {
    document.getElementById('briefing-content').innerHTML =
      '<div class="load-error">// TRANSMISSION ERROR — FILE NOT FOUND: briefings/' + id + '.html</div>';
  }

  function activateWeek(id) {
    if (activeId === id) return;
    activeId = id;

    // Update tab states
    document.querySelectorAll('.week-tab').forEach(function (btn) {
      btn.classList.toggle('active', btn.dataset.id === id);
    });

    // Update URL hash without scrolling
    history.replaceState(null, '', '#' + id);

    // Serve from cache if available
    if (cache[id]) {
      showContent(cache[id]);
      return;
    }

    showLoading();

    fetch('briefings/' + id + '.html')
      .then(function (r) {
        if (!r.ok) throw new Error('not found');
        return r.text();
      })
      .then(function (html) {
        cache[id] = html;
        showContent(html);
      })
      .catch(function () {
        showError(id);
      });
  }

  function buildTabs(data) {
    weeks = data;
    var container = document.getElementById('week-tabs');
    container.innerHTML = '';

    data.forEach(function (week) {
      var btn = document.createElement('button');
      btn.className = 'week-tab';
      if (week.status === 'active') btn.classList.add('status-active');
      btn.dataset.id = week.id;
      btn.textContent = week.label;
      btn.title = week.title + ' — ' + week.summary;
      btn.addEventListener('click', function () { activateWeek(week.id); });
      container.appendChild(btn);
    });
  }

  // Boot: load index, build tabs, activate default week
  fetch('briefings/index.json')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      buildTabs(data);

      // Honour URL hash if valid, otherwise default to first week
      var hash = location.hash.slice(1);
      var target = data.find(function (w) { return w.id === hash; }) || data[0];
      activateWeek(target.id);
    })
    .catch(function () {
      document.getElementById('briefing-content').innerHTML =
        '<div class="load-error">// CAMPBELL OFFLINE — QUEUE UNAVAILABLE</div>';
    });
}());
</script>

</body>
</html>
