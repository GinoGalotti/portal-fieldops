<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P.O.R.T.A.L — CAMPBELL Priority Queue</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../briefing.css">
<style>

/* ── TOP BAR ── */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: 860px;
  margin: 0 auto 48px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
  font-size: 0.65rem;
  letter-spacing: 0.15em;
}
.top-bar a {
  color: var(--text-dim);
  text-decoration: none;
  transition: color 0.15s;
}
.top-bar a:hover { color: var(--green); }
.top-bar .campbell-id {
  color: var(--green-dim);
  display: flex;
  align-items: center;
  gap: 6px;
}
.top-bar .campbell-id .blink {
  display: inline-block;
  width: 6px; height: 6px;
  background: var(--green-dim);
  border-radius: 50%;
  animation: blink 1.4s step-end infinite;
}

/* ── WEEK SWITCHER ── */
.week-switcher {
  max-width: 860px;
  margin: 0 auto 48px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}
.sw-label {
  font-size: 0.6rem;
  letter-spacing: 0.25em;
  color: var(--text-dim);
}
.week-tabs {
  display: flex;
  gap: 2px;
  flex-wrap: wrap;
  justify-content: center;
}
.week-tab {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.2em;
  padding: 7px 22px;
  border: 1px solid var(--border-bright);
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.15s;
}
.week-tab:hover {
  border-color: var(--green-dim);
  color: var(--green);
}
.week-tab.active {
  border-color: var(--green);
  background: rgba(111,207,111,0.06);
  color: var(--green);
}
.week-tab.status-active::after {
  content: ' ●';
  color: var(--green);
  font-size: 0.5rem;
  vertical-align: middle;
}

/* ── CONTENT AREA ── */
#briefing-content {
  min-height: 200px;
}

/* ── LOADING STATE ── */
.loading {
  max-width: 860px;
  margin: 60px auto;
  text-align: center;
  color: var(--text-dim);
  font-size: 0.72rem;
  letter-spacing: 0.25em;
  animation: blink 1.4s step-end infinite;
}

/* ── ERROR STATE ── */
.load-error {
  max-width: 860px;
  margin: 60px auto;
  text-align: center;
  color: var(--red);
  font-size: 0.7rem;
  letter-spacing: 0.2em;
  border: 1px solid var(--red-dim);
  padding: 20px;
}

</style>
</head>
<body>

<div class="top-bar">
  <a href="../index.html">← PORTAL ARCHIVE</a>
  <div class="campbell-id">
    <span class="blink"></span>
    CAMPBELL ONLINE
  </div>
</div>

<div class="week-switcher">
  <div class="sw-label">// CAMPBELL — PRIORITY QUEUE · SELECT TRANSMISSION WINDOW</div>
  <div class="week-tabs" id="week-tabs">
    <!-- tabs injected by JS from briefings/index.json -->
  </div>
</div>

<div id="briefing-content">
  <div class="loading">// INITIALISING TRANSMISSION...</div>
</div>

<script>
(function () {
  var cache    = {};   // rendered HTML strings keyed by week id
  var activeId = null;
  var allWeeks = [];

  // Consistent fake CAMPBELL version for the session
  var ver = '2.' + (Math.floor(Math.random() * 9) + 1) + '.' + (Math.floor(Math.random() * 89) + 10);

  // ── UTILITIES ──────────────────────────────────────────────────────────────

  function esc(s) {
    if (s == null) return '';
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // Replace {{color:text}} tokens with inline colored spans (same pattern as incidents.json)
  function inline(s) {
    return esc(s).replace(/\{\{(\w[\w-]*):([^}]+)\}\}/g, function (_, cls, txt) {
      return '<span class="v ' + cls + '">' + txt + '</span>';
    });
  }

  // ── RENDERERS ──────────────────────────────────────────────────────────────

  function renderRow(row) {
    if (row.divider) return '<hr class="t-divider">';
    var cls  = row.color ? ' ' + row.color : '';
    var note = row.note  ? ' <span class="dim">' + esc(row.note) + '</span>' : '';
    return '<div class="data-row">' +
      '<span class="k">' + esc(row.k) + ':</span>' +
      '<span class="v' + cls + '">' + inline(row.v) + note + '</span>' +
      '</div>';
  }

  function renderDirective(d) {
    if (!d) return '';
    var html = '<div class="directive">';
    html += '<span class="directive-label">' + esc(d.label) + '</span>';
    html += (d.paragraphs || []).map(esc).join('<br><br>');
    if (d.dim_note) html += '<br><br><span class="t-dim">' + esc(d.dim_note) + '</span>';
    html += '</div>';
    return html;
  }

  function renderCase(c) {
    var letter = c.id.replace('case-', '').toUpperCase();
    var html = '<div class="briefing ' + c.id + '" data-case="' + letter + '">';

    // Card header
    html += '<div class="card-header"><div>';
    html += '<div class="report-id">'    + esc(c.report_id) + '</div>';
    html += '<div class="report-title">' + esc(c.title)     + '</div>';
    html += '<div class="report-subtitle">' + esc(c.subtitle) + '</div>';
    html += '</div>';
    html += '<div class="priority-badge ' + c.priority + '">' + esc(c.priority_label) + '</div>';
    html += '</div>';

    // Terminal block
    html += '<div class="terminal">';
    html += '<div class="t-label"><span>FIELD BRIEFING — AUTHORISED PERSONNEL ONLY</span><span class="blink"></span></div>';
    (c.rows || []).forEach(function (row) { html += renderRow(row); });
    html += renderDirective(c.directive);
    html += '</div>';

    // Card footer
    html += '<div class="card-footer">';
    html += '<span><span class="status-dot"></span>' + esc(c.footer_status) + '</span>';
    html += '<span>' + esc(c.footer_ref) + ' · CAMPBELL v<span class="ver"></span></span>';
    html += '<span>' + esc(c.footer_class) + '</span>';
    html += '</div>';

    html += '</div>';
    return html;
  }

  function renderWeek(week) {
    var html = '';

    // Page header
    html += '<div class="page-header">';
    html += '<div class="portal-logo">// P · O · R · T · A · L</div>';
    html += '<h1>CAMPBELL</h1>';
    html += '<div class="sub">PRIORITY QUEUE — PENDING FIELD ASSIGNMENT</div>';
    html += '<div class="divider"></div>';
    if (week.header_note)      html += '<div class="note">'      + esc(week.header_note)      + '</div>';
    if (week.header_timestamp) html += '<div class="timestamp">' + esc(week.header_timestamp) + '</div>';
    html += '</div>';

    // Items: section labels + cases (interleaved in order)
    (week.items || []).forEach(function (item) {
      if (item.type === 'section-label') {
        html += '<div class="' + item.css_class + '">' + esc(item.text) + '</div>';
      } else if (item.type === 'case') {
        html += renderCase(item);
      }
    });

    // Closing CAMPBELL note
    var n = week.closing_note;
    html += '<div class="campbell-note">';
    html += '<div class="cn-header"><span>' + esc(n.header) + '</span><span>' + esc(n.count) + '</span></div>';
    html += '<div class="cn-text">' + (n.lines || []).map(esc).join('<br>') + '</div>';
    html += '<div class="cn-sig">' + esc(n.sig) + '</div>';
    html += '</div>';

    return html;
  }

  // ── DISPLAY HELPERS ────────────────────────────────────────────────────────

  function fillVer(container) {
    container.querySelectorAll('.ver').forEach(function (el) { el.textContent = ver; });
  }

  function showContent(html) {
    var el = document.getElementById('briefing-content');
    el.innerHTML = html;
    fillVer(el);
  }

  // ── TAB + ACTIVATION ───────────────────────────────────────────────────────

  function activateWeek(id) {
    if (activeId === id) return;
    activeId = id;

    document.querySelectorAll('.week-tab').forEach(function (btn) {
      btn.classList.toggle('active', btn.dataset.id === id);
    });
    history.replaceState(null, '', '#' + id);

    if (cache[id]) { showContent(cache[id]); return; }

    var week = allWeeks.find(function (w) { return w.id === id; });
    if (!week) {
      document.getElementById('briefing-content').innerHTML =
        '<div class="load-error">// TRANSMISSION ERROR — WEEK NOT FOUND: ' + id + '</div>';
      return;
    }

    var html = renderWeek(week);
    cache[id] = html;
    showContent(html);
  }

  function buildTabs(weeks) {
    var container = document.getElementById('week-tabs');
    container.innerHTML = '';
    weeks.forEach(function (week) {
      var btn = document.createElement('button');
      btn.className = 'week-tab';
      if (week.status === 'active') btn.classList.add('status-active');
      btn.dataset.id = week.id;
      btn.textContent = week.label;
      btn.title = week.title + ' — ' + week.summary;
      btn.addEventListener('click', function () { activateWeek(week.id); });
      container.appendChild(btn);
    });
  }

  // ── BOOT ───────────────────────────────────────────────────────────────────

  fetch('../data/briefings.json')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      allWeeks = data.weeks;
      buildTabs(allWeeks);
      var hash   = location.hash.slice(1);
      var target = allWeeks.find(function (w) { return w.id === hash; }) || allWeeks[0];
      activateWeek(target.id);
    })
    .catch(function () {
      document.getElementById('briefing-content').innerHTML =
        '<div class="load-error">// CAMPBELL OFFLINE — QUEUE UNAVAILABLE</div>';
    });
}());
</script>

</body>
</html>
