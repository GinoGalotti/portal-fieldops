<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P.O.R.T.A.L — Operative Reports Review</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;400;600;700&family=Barlow:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../keeper.css">
<style>

  .review-wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px 80px;
  }

  /* ─── WEEK TABS ─── */
  .review-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 6px;
  }
  .rtab {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.15em;
    padding: 7px 22px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.15s;
  }
  .rtab:hover { border-color: var(--keeper); color: var(--text); }
  .rtab.active { background: var(--keeper); border-color: var(--keeper); color: #fff; }

  .review-subtitle {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 28px;
    padding-left: 1px;
  }

  /* ─── FILED COUNT ─── */
  .op-filed-count {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    margin-bottom: 14px;
  }

  /* ─── STATUS ─── */
  .op-status {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    padding: 40px 0;
    text-align: center;
  }

  /* ─── CARD GRID ─── */
  .op-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
  }
  @media (max-width: 1100px) { .op-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 720px)  { .op-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 480px)  { .op-grid { grid-template-columns: 1fr; } }

  /* ─── CARD ─── */
  .op-card {
    border: 1px solid var(--border);
    border-top: 3px solid var(--h-color, var(--border));
    background: var(--bg2);
    padding: 14px;
    border-radius: 2px;
  }
  .op-card--empty { opacity: 0.4; }

  .op-hunter-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--h-color, var(--text));
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .op-filed-badge {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.52rem;
    letter-spacing: 0.1em;
    color: var(--green);
  }
  .op-not-filed {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.52rem;
    letter-spacing: 0.1em;
    color: var(--text-dim);
  }

  /* ─── RATINGS ─── */
  .op-ratings {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px 10px;
    margin-bottom: 12px;
  }
  .op-rating-item { display: flex; align-items: center; gap: 6px; }
  .op-rating-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.5rem;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    width: 56px;
    flex-shrink: 0;
  }
  .op-rating-pips { display: flex; gap: 3px; }
  .op-pip {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    border: 1px solid var(--border);
  }
  .op-pip.filled { background: var(--h-color, var(--keeper)); border-color: var(--h-color, var(--keeper)); }

  /* ─── TEXT FIELDS ─── */
  .op-field { margin-bottom: 10px; }
  .op-field-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.52rem;
    letter-spacing: 0.15em;
    color: var(--text-dim);
    margin-bottom: 3px;
  }
  .op-field-value {
    font-family: 'Barlow', sans-serif;
    font-size: 0.82rem;
    line-height: 1.45;
    color: var(--text);
  }
  .op-field-value--empty {
    color: var(--text-dim);
    font-style: italic;
    font-size: 0.75rem;
  }

  /* ─── SCENE NOTES ─── */
  .op-scenes {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .op-scene-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.5rem;
    letter-spacing: 0.12em;
    color: var(--keeper-dim);
    margin-top: 8px;
    margin-bottom: 3px;
  }
  .op-scene-value {
    font-family: 'Barlow', sans-serif;
    font-size: 0.8rem;
    line-height: 1.4;
    color: var(--text);
    padding-left: 8px;
    border-left: 2px solid var(--keeper-dim);
  }

</style>
</head>
<body>

<div class="keeper-banner">KEEPER ACCESS ONLY — DO NOT SHARE THIS URL WITH PLAYERS</div>
<header>
  <a href="../index.html" class="logo">P<span>.</span>O<span>.</span>R<span>.</span>T<span>.</span>A<span>.</span>L <span style="font-size:0.7rem;color:var(--keeper-dim);margin-left:8px;">// KEEPER</span></a>
  <nav id="keeper-nav"></nav><script src="../missions/keeper-nav.js"></script>
  <div><span class="keeper-dot"></span><span style="font-family:'Share Tech Mono',monospace;font-size:0.7rem;letter-spacing:0.1em;color:var(--keeper-dim)">RESTRICTED ACCESS</span></div>
</header>

<section class="hero">
  <div class="hero-inner">
    <div class="hero-eyebrow">// KEEPER — AFTER-ACTION REVIEW</div>
    <h1 class="hero-title">Operative<strong>Reports</strong></h1>
    <p class="hero-desc">All player operative field reports for a given week, side by side.</p>
  </div>
</section>

<main>
<div class="review-wrap">

  <!-- WEEK TABS -->
  <div class="review-tabs" id="week-tabs"></div>
  <div class="review-subtitle" id="review-subtitle"></div>

  <!-- REPORT GRID -->
  <div id="reports-body">
    <div class="op-status">// SELECT A WEEK ABOVE</div>
  </div>

</div>
</main>

<script src="../session-state.js"></script>
<script>
(function () {

  var OP_HUNTER_LIST = ['rex', 'reed', 'alan', 'sven', 'john'];

  var OP_HUNTER_META = {
    rex:  { name: 'Rex Bangley',  color: '#f0a500' },
    reed: { name: 'Reed Atwood',  color: '#3ab5b0' },
    alan: { name: 'Alan Frazier', color: '#2ec4b6' },
    sven: { name: 'Sven',         color: '#a78bfa' },
    john: { name: 'John Johnson', color: '#e05c5c' }
  };

  var OP_RATING_LABELS = {
    story: 'STORY', atmosphere: 'ATMOS', role: 'ROLE',
    emotion: 'EMOT', overall: 'OVERALL'
  };

  var OP_SCENE_LABELS = {
    'eszter-balint':    'ESZTER & BÁLINT',
    'portal-directive': 'THE PORTAL DIRECTIVE',
    'your-moment':      "OPERATIVE'S MOMENT",
    'cartographer':     'THE CARTOGRAPHER',
    'aldermoor':        'ALDERMOOR DISTRICT'
  };

  var OP_WEEK_SCENES = {
    W01: ['eszter-balint', 'portal-directive', 'your-moment'],
    W02: ['cartographer', 'aldermoor', 'your-moment']
  };

  var WEEKS = [
    { id: 'W01', label: 'W01', subtitle: 'A Promise is a Promise' },
    { id: 'W02', label: 'W02', subtitle: 'Something That Wants to Be Known' }
  ];

  var currentWeek = null;

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function buildTabs() {
    var container = document.getElementById('week-tabs');
    WEEKS.forEach(function (w) {
      var btn = document.createElement('button');
      btn.className = 'rtab';
      btn.textContent = w.label + ' — ' + w.subtitle;
      btn.dataset.week = w.id;
      btn.addEventListener('click', function () {
        document.querySelectorAll('.rtab').forEach(function (t) { t.classList.remove('active'); });
        btn.classList.add('active');
        loadWeek(w.id);
      });
      container.appendChild(btn);
    });
  }

  function loadWeek(week) {
    currentWeek = week;
    var found = WEEKS.filter(function (w) { return w.id === week; })[0];
    document.getElementById('review-subtitle').textContent = found ? ('// ' + week + ' — ' + found.subtitle) : '';
    document.getElementById('reports-body').innerHTML = '<div class="op-status">// LOADING…</div>';

    var promises = OP_HUNTER_LIST.map(function (hid) {
      return fetch('/api/v1/player-reports/' + week + '/' + hid + '/state')
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (data) {
          return { hid: hid, data: (data && Object.keys(data).length > 0) ? data : null };
        })
        .catch(function () { return { hid: hid, data: null }; });
    });

    Promise.all(promises).then(function (results) {
      var byHunter = {};
      results.forEach(function (r) { byHunter[r.hid] = r.data; });
      renderGrid(byHunter, week);
    });
  }

  function renderGrid(byHunter, week) {
    var sceneIds = OP_WEEK_SCENES[week] || [];
    var ratings  = ['story', 'atmosphere', 'role', 'emotion', 'overall'];
    var filedCount = OP_HUNTER_LIST.filter(function (h) { return byHunter[h]; }).length;

    if (filedCount === 0) {
      document.getElementById('reports-body').innerHTML =
        '<div class="op-status">// NO REPORTS FILED FOR ' + escHtml(week) + '</div>';
      return;
    }

    var html = '<div class="op-filed-count">' + filedCount + ' / ' + OP_HUNTER_LIST.length + ' REPORTS FILED — ' + escHtml(week) + '</div>';
    html += '<div class="op-grid">';

    OP_HUNTER_LIST.forEach(function (hid) {
      var d    = byHunter[hid];
      var meta = OP_HUNTER_META[hid];

      html += '<div class="op-card' + (d ? '' : ' op-card--empty') + '" style="--h-color:' + meta.color + '">';
      html += '<div class="op-hunter-name">' + escHtml(meta.name);
      html += d ? '<span class="op-filed-badge">✓ FILED</span>' : '<span class="op-not-filed">NOT FILED</span>';
      html += '</div>';

      if (d) {
        // Ratings
        html += '<div class="op-ratings">';
        ratings.forEach(function (rid) {
          var val = (d.ratings && d.ratings[rid]) || 0;
          html += '<div class="op-rating-item"><span class="op-rating-label">' + OP_RATING_LABELS[rid] + '</span><div class="op-rating-pips">';
          for (var i = 1; i <= 5; i++) {
            html += '<div class="op-pip' + (i <= val ? ' filled' : '') + '"></div>';
          }
          html += '</div></div>';
        });
        html += '</div>';

        // Text fields
        [
          { key: 'favourite', label: 'FAVOURITE MOMENT' },
          { key: 'different', label: 'WOULD DO DIFFERENTLY' },
          { key: 'operative', label: "OPERATIVE'S FEELINGS" },
          { key: 'other',     label: 'OTHER NOTES' }
        ].forEach(function (f) {
          var val = d[f.key] && d[f.key].trim();
          html += '<div class="op-field"><div class="op-field-label">' + f.label + '</div>';
          html += val
            ? '<div class="op-field-value">' + escHtml(val) + '</div>'
            : '<div class="op-field-value op-field-value--empty">—</div>';
          html += '</div>';
        });

        // Scene notes (only those with content)
        var hasScenes = sceneIds.some(function (scId) { return d.scenes && d.scenes[scId] && d.scenes[scId].trim(); });
        if (hasScenes) {
          html += '<div class="op-scenes">';
          sceneIds.forEach(function (scId) {
            var val = d.scenes && d.scenes[scId] && d.scenes[scId].trim();
            if (!val) return;
            html += '<div class="op-scene-label">' + escHtml(OP_SCENE_LABELS[scId] || scId.toUpperCase()) + '</div>';
            html += '<div class="op-scene-value">' + escHtml(val) + '</div>';
          });
          html += '</div>';
        }
      }

      html += '</div>'; // end op-card
    });

    html += '</div>'; // end op-grid
    document.getElementById('reports-body').innerHTML = html;
  }

  // ── BOOT ──────────────────────────────────────────────────────────────────

  buildTabs();
  // Auto-load W01
  document.querySelector('.rtab').classList.add('active');
  loadWeek('W01');

}());
</script>
</body>
</html>
