        }

        // extra notes (bim, anchor spike, alan note, etc.)
        ['bim_note','anchor_spike_effect','alan_note','campbell_private'].forEach(function (key) {
          if (!e[key]) return;
          var labels = { bim_note: 'BIM NOTE', anchor_spike_effect: 'ANCHOR SPIKE', alan_note: 'ALAN NOTE', campbell_private: 'CAMPBELL PRIVATE' };
          html += '<div class="data-field" style="margin-top:0.3rem"><span class="data-stat-label">' + labels[key] + '</span> ' + escHtml(e[key]) + '</div>';
        });

        html += '</div>'; // end entity block
      });
    }

    // ── threats (minions, bystanders, villains) ──
    if (sess.threats && sess.threats.length) {
      sess.threats.forEach(function (t) {
        html += '<div class="ref-section data-threat-block">';

        // header
        html += '<div class="ref-label">// ' + escHtml(t.name).toUpperCase();
        if (t.subtitle) html += ' &nbsp;<span style="opacity:0.55;font-weight:400">' + escHtml(t.subtitle) + '</span>';
        html += '</div>';

        // type + motivation
        html += '<div class="data-threat-type">' + escHtml(t.type) + '</div>';
        if (t.motivation) html += '<div class="data-field"><span class="data-stat-label">MOTIVATION</span> ' + escHtml(t.motivation) + '</div>';

        // stat row
        var statParts = [];
        if (t.harm)          statParts.push('<span class="data-stat-label">HARM</span> ' + escHtml(t.harm));
        if (t.armour)        statParts.push('<span class="data-stat-label">ARMOUR</span> ' + escHtml(String(t.armour)));
        if (t.harm_capacity) statParts.push('<span class="data-stat-label">HP</span> ' + escHtml(String(t.harm_capacity)));
        if (statParts.length) html += '<div class="data-stat-row" style="margin-top:0.35rem">' + statParts.join(' &nbsp;·&nbsp; ') + '</div>';

        // moves
        if (t.moves && t.moves.length) {
          html += '<div class="data-stat-label" style="margin-top:0.45rem">MOVES</div>';
          html += '<ul class="ref-list">';
          t.moves.forEach(function (m) { html += '<li>' + escHtml(m) + '</li>'; });
          html += '</ul>';
        }

        // notes
        if (t.notes) html += '<div class="data-field" style="margin-top:0.4rem"><span class="data-stat-label">NOTES</span> ' + escHtml(t.notes) + '</div>';

        html += '</div>';
      });
    }

    // ── equipment ──
    if (sess.equipment && sess.equipment.length) {
      html += '<div class="ref-section">';
      html += '<div class="ref-label">// FIELD EQUIPMENT</div>';
      sess.equipment.forEach(function (eq) {
        html += '<div class="data-equip-block">';
        html += '<div class="data-equip-name">' + escHtml(eq.name);
        if (eq.subtitle) html += ' <span class="data-equip-sub">' + escHtml(eq.subtitle) + '</span>';
        html += '</div>';
        if (eq.description)        html += '<div class="data-field" style="margin-top:0.2rem">' + escHtml(eq.description) + '</div>';
        if (eq.hunter_interaction) html += '<div class="data-field" style="margin-top:0.25rem"><span class="data-stat-label">HUNTER USE</span> ' + escHtml(eq.hunter_interaction) + '</div>';
        if (eq.plot_note)          html += '<div class="data-field" style="margin-top:0.25rem"><span class="data-stat-label">PLOT NOTE</span> ' + escHtml(eq.plot_note) + '</div>';
        html += '</div>';
      });
      html += '</div>';
    }

    // ── readaloud ──
    var reads = (sess.readaloud || []).filter(function (r) { return r.text && r.text.trim(); });
    if (reads.length) {
      reads.forEach(function (r) {
        html += '<div class="ref-section">' +
          '<div class="ref-label">// READALOUD — ' + escHtml(r.label).toUpperCase() + '</div>' +
          '<div class="data-readaloud">' + escHtml(r.text) + '</div>' +
        '</div>';
      });
    }

    body.innerHTML = html;
  }

  // ── FEED MESSAGES ─────────────────────────────────────────────────────────
  // Any player: text box at bottom of feed
  window.sendFeedMessage = function () {
    var nameEl = document.getElementById('composer-name');
    var msgEl  = document.getElementById('composer-msg');
    var name   = (nameEl.value.trim() || (hunterId ? HUNTER_NAMES[hunterId] : null) || 'OPERATIVE').toUpperCase();
    var body   = msgEl.value.trim();
    if (!body) return;

    fetch('/api/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sender: name, body: body, session_id: getCurrentSession() })
    }).then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.id) {
          msgEl.value = '';
          var entry = { _msg: true, id: data.id, sender: name, body: body, delivered_at: new Date().toISOString() };
          appendFeedEntry(entry);
          scrollFeedToBottom();
          if (data.id > lastMsgId) lastMsgId = data.id;
        }
      }).catch(function () {});
  };

  // Keeper: clear the visible feed for all connected clients.
  // Posts a 'clear' sentinel to D1 — all clients wipe their feed when they receive it via polling.
  // History is preserved in D1 and still accessible via "↑ LOAD EARLIER HISTORY".
  window.keeperClearFeed = function () {
    // Clear this client's view immediately
    feedEntries = [];
    var container = document.getElementById('feed-entries');
    var loadWrap  = document.getElementById('feed-load-more-wrap');
    while (container.lastChild && container.lastChild !== loadWrap) {
      container.removeChild(container.lastChild);
    }
    // Post clear sentinel — other clients wipe on next poll; reloads start fresh
    fetch('/api/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sender: 'KEEPER', body: '// FEED CLEARED', type: 'clear', session_id: getCurrentSession() })
    }).then(function (r) { return r.json(); }).then(function (data) {
      if (data.id) lastMsgId = data.id;
    }).catch(function () {});
  };

  // Keeper: send as CAMPBELL / DIRECTOR / etc.
  window.sendKeeperMessage = function () {
    var sender = document.getElementById('msg-sender').value;
    var body   = document.getElementById('msg-body').value.trim();
    if (!body) return;
    fetch('/api/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sender: sender, body: body, session_id: getCurrentSession() })
    }).then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.id) {
          document.getElementById('msg-body').value = '';
          var entry = { _msg: true, id: data.id, sender: sender, body: body, delivered_at: new Date().toISOString() };
          appendFeedEntry(entry);
          scrollFeedToBottom();
          if (data.id > lastMsgId) lastMsgId = data.id;
        }
      }).catch(function () {});
  };

  // Enter key in feed composer
  document.getElementById('composer-msg').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendFeedMessage(); }
  });

  // ── FEED RENDERING ────────────────────────────────────────────────────────
  function fmtTime(ts) {
    if (!ts) return '';
    try {
      var d = new Date(ts.includes('T') ? ts : ts.replace(' ','T') + 'Z');
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    } catch(e) { return ''; }
  }

  // Resolve the outcomes object for an entry — from the entry itself (local rolls)
  // or by looking up the move name in loaded data (polled rolls from D1).
  function resolveOutcomes(entry) {
    if (entry.outcomes) return entry.outcomes;
    var name = (entry.move_name || '').toLowerCase().trim();
    if (!name) return null;
    // Search basic moves by name
    if (basic_moves && basic_moves.basic_moves) {
      var bm = basic_moves.basic_moves.filter(function (m) {
        return m.name.toLowerCase() === name;
      })[0];
      if (bm && bm.outcomes) return bm.outcomes;
    }
    // Search playbook moves by name
    if (playbook_moves) {
      if (playbook_moves.moves) {
        var keys = Object.keys(playbook_moves.moves);
        for (var i = 0; i < keys.length; i++) {
          var pm = playbook_moves.moves[keys[i]];
          if (pm.name.toLowerCase() === name) return pm;
        }
      }
      if (playbook_moves.always_active_moves) {
        var hunters = Object.keys(playbook_moves.always_active_moves);
        for (var h = 0; h < hunters.length; h++) {
          var list = playbook_moves.always_active_moves[hunters[h]];
          for (var j = 0; j < list.length; j++) {
            if (list[j].name.toLowerCase() === name) return list[j];
          }
        }
      }
    }
    return null;
  }

  // Build the hover detail HTML: questions (if any) on top, then the specific outcome text.
  function buildDetailHtml(entry) {
    var outcomes = resolveOutcomes(entry);
    if (!outcomes) return '';

    var outcomeKey = entry.outcome === 'advanced' ? '12_plus'
                   : entry.outcome === 'hit'      ? '10_plus'
                   : entry.outcome === 'partial'  ? '7_9'
                   : 'miss';
    var text = outcomes[outcomeKey] || outcomes['general'] || outcomes['description'] || '';
    if (!text && !outcomes.questions) return '';

    var html = '';
    // Questions list first (Investigate a Mystery, Read a Bad Situation)
    if (outcomes.questions && outcomes.questions.length) {
      html += '<div class="feed-detail-questions">';
      html += '<div class="feed-detail-qlabel">// QUESTIONS — spend hold to ask one</div>';
      html += '<ul class="feed-detail-qlist">';
      outcomes.questions.forEach(function (q) {
        html += '<li>' + escHtml(q) + '</li>';
      });
      html += '</ul></div>';
    }
    // Specific outcome text
    if (text) {
      html += '<div class="feed-detail-text">' + escHtml(text) + '</div>';
    }
    return html;
  }

  function buildBreakdown(entry) {
    var parts = '[<span class="die">' + entry.roll_1 + '</span> + <span class="die">' + entry.roll_2 + '</span>';
    if (entry.stat_val !== undefined && entry.stat_val !== null && entry.stat_val !== 0) {
      parts += ' + <span class="stat-val">' + (entry.stat_val > 0 ? '+' : '') + entry.stat_val + '</span>';
    } else if (entry.stat_used && hunterSheet && hunterSheet.stats) {
      var sv = parseInt(hunterSheet.stats[entry.stat_used] || 0, 10);
      if (sv !== 0) parts += ' + <span class="stat-val">' + (sv > 0 ? '+' : '') + sv + '</span>';
    }
    if (entry.modifier && entry.modifier !== 0) {
      parts += ' + <span class="mod-val">' + (entry.modifier > 0 ? '+' : '') + entry.modifier + '</span>';
    }
    parts += ' = <span class="total">' + entry.total + '</span>]';
    return parts;
  }

  function buildFeedEntryHtml(entry) {
    var entryType = entry.type || (entry._msg || entry.sender ? 'message' : null);

    // ── Clear sentinel — never rendered ────────────────────────────────────
    if (entryType === 'clear') return '';

    // ── Readaloud ──────────────────────────────────────────────────────────
    if (entryType === 'readaloud') {
      var payload = {};
      try { payload = typeof entry.payload === 'string' ? JSON.parse(entry.payload) : (entry.payload || {}); } catch (x) {}
      var label = payload.label || entry.subject || '';
      var text  = payload.text  || entry.body    || '';
      return '<div class="feed-entry feed-readaloud">' +
        '<div class="feed-readaloud-eyebrow">// KEEPER READALOUD' + (label ? ' — ' + escHtml(label).toUpperCase() : '') + '</div>' +
        '<div class="feed-readaloud-text">' + escHtml(text) + '</div>' +
        '<div class="feed-time" style="margin-top:0.4rem">' + fmtTime(entry.delivered_at || entry.created_at) + '</div>' +
      '</div>';
    }

    // ── PDA message ────────────────────────────────────────────────────────
    if (entryType === 'pda') {
      var payload = {};
      try { payload = typeof entry.payload === 'string' ? JSON.parse(entry.payload) : (entry.payload || {}); } catch (x) {}
      var from    = payload.from    || entry.sender  || 'UNKNOWN';
      var subject = payload.subject || entry.subject || '';
      var body    = payload.body    || entry.body    || '';
      var isCamp  = from.toUpperCase().indexOf('CAMPBELL') !== -1;
      var pdaClass = isCamp ? 'pda-campbell' : 'pda-other';
      var valClass = 'pda-field-value';
      return '<div class="feed-entry feed-pda ' + pdaClass + '">' +
        '<div class="pda-chrome">' +
          '<span class="pda-chrome-label">P.O.R.T.A.L FIELD COMMS · SECURE</span>' +
          '<span class="pda-chrome-status">' + fmtTime(entry.delivered_at || entry.created_at) + '</span>' +
        '</div>' +
        '<div class="pda-body">' +
          '<div class="pda-header-row"><span class="pda-field-label">FROM:</span><span class="' + valClass + '">' + escHtml(from) + '</span></div>' +
          (subject ? '<div class="pda-header-row"><span class="pda-field-label">SUBJ:</span><span class="' + valClass + '">' + escHtml(subject) + '</span></div>' : '') +
          '<div class="pda-message-text">' + escHtml(body) + '</div>' +
          '<div class="pda-footer">// MSG DELIVERED · ENCRYPT 128 · P.O.R.T.A.L CAMPBELL RELAY</div>' +
        '</div>' +
      '</div>';
    }

    // ── Document ───────────────────────────────────────────────────────────
    if (entryType === 'document') {
      var payload = {};
      try { payload = typeof entry.payload === 'string' ? JSON.parse(entry.payload) : (entry.payload || {}); } catch (x) {}
      var label          = payload.label          || entry.subject || '';
      var classification = payload.classification || 'FIELD EVIDENCE';
      var body           = payload.body           || entry.body    || '';
      return '<div class="feed-entry feed-document">' +
        '<div class="document-chrome">' +
          '<span class="document-classification">// ' + escHtml(classification) + '</span>' +
          '<span class="document-classification">' + fmtTime(entry.delivered_at || entry.created_at) + '</span>' +
        '</div>' +
        (label ? '<div class="document-title">' + escHtml(label) + '</div>' : '') +
        '<div class="document-body">' + escHtml(body) + '</div>' +
      '</div>';
    }

    // ── Classified (keeper-only) ────────────────────────────────────────────
    if (entryType === 'classified') {
      var payload = {};
      try { payload = typeof entry.payload === 'string' ? JSON.parse(entry.payload) : (entry.payload || {}); } catch (x) {}
      var label = payload.label || entry.subject || '';
      var body  = payload.body  || entry.body    || '';
      if (keeperMode) {
        return '<div class="feed-entry feed-classified">' +
          '<div class="classified-chrome">' +
            '<span class="classified-eyebrow">// KEEPER CLASSIFIED — RESTRICTED ACCESS</span>' +
            '<span class="classified-time">' + fmtTime(entry.delivered_at || entry.created_at) + '</span>' +
          '</div>' +
          (label ? '<div class="classified-title">' + escHtml(label) + '</div>' : '') +
          '<div class="classified-body">' + escHtml(body) + '</div>' +
        '</div>';
      } else {
        return '<div class="feed-entry feed-redacted">' +
          '<div class="redacted-chrome">' +
            '<span class="redacted-label">// INCOMING TRANSMISSION — CLASSIFICATION: RESTRICTED</span>' +
            '<span class="redacted-label">' + fmtTime(entry.delivered_at || entry.created_at) + '</span>' +
          '</div>' +
          '<div class="redacted-body">' +
            '<div class="redacted-bar"></div>' +
            '<div class="redacted-bar"></div>' +
            '<div class="redacted-bar"></div>' +
            '<div class="redacted-footer">[ CLASSIFIED — KEEPER ACCESS ONLY ]</div>' +
          '</div>' +
        '</div>';
      }
    }

    // ── Image / Map ────────────────────────────────────────────────────────
    if (entryType === 'image' || entryType === 'map') {
      var payload = {};
      try { payload = typeof entry.payload === 'string' ? JSON.parse(entry.payload) : (entry.payload || {}); } catch (x) {}
      var src   = payload.src   || '';
      var label = payload.label || entry.subject || '';
      var isMap = entryType === 'map';
      return '<div class="feed-entry feed-image">' +
        '<div class="feed-image-type-tag">// ' + (isMap ? 'MAP' : 'IMAGE') + ' SHARED BY KEEPER</div>' +
        (src ? '<div class="feed-image-card" onclick="openLightbox(\'' + escHtml(src) + '\',\'' + escHtml(label) + '\')">' +
          '<img src="' + escHtml(src) + '" alt="' + escHtml(label) + '" loading="lazy">' +
        '</div>' : '') +
        (label ? '<div class="feed-image-label">' + escHtml(label) + '</div>' : '') +
      '</div>';
    }

    // ── Standard chat / CAMPBELL message ──────────────────────────────────
    if (entryType === 'message' || entry._msg || entry.sender) {
      return '<div class="feed-entry msg-entry">' +
        '<div class="feed-msg-sender">// ' + escHtml(entry.sender || 'SYSTEM') + '</div>' +
        '<div class="feed-msg-body">' + escHtml(entry.body || '') + '</div>' +
        '<div class="feed-time">' + fmtTime(entry.delivered_at || entry.created_at || entry.timestamp) + '</div>' +
      '</div>';
    }

    var hid      = entry.hunter_id || '?';
    var color    = HUNTER_COLORS[hid] || '#aaa';
    var hunterName = HUNTER_NAMES[hid] || hid;
    var outcome  = entry.outcome || 'miss';
    var badgeText = outcome === 'advanced' ? '⚡ ADVANCED'
                  : outcome === 'hit'      ? '✓ SUCCESS'
                  : outcome === 'partial'  ? '~ PARTIAL'
                  : '✗ FAILURE';
    var detail   = buildDetailHtml(entry);

    return '<div class="feed-entry">' +
      '<div class="feed-entry-meta">' +
        '<span class="feed-hunter-tag" style="color:' + color + ';border-color:' + color + '30;background:' + color + '10">' + hunterName.toUpperCase() + '</span>' +
        '<span class="feed-move-name">' + escHtml(entry.move_name || '') + '</span>' +
        '<span class="feed-time">' + fmtTime(entry.rolled_at || entry.timestamp) + '</span>' +
      '</div>' +
      '<div class="feed-roll-line">' +
        '<span class="feed-breakdown">' + buildBreakdown(entry) + '</span>' +
        '<span class="feed-badge ' + outcome + '">' + badgeText + '</span>' +
      '</div>' +
      (detail ? '<div class="feed-outcome-detail">' + detail + '</div>' : '') +
    '</div>';
  }

  function appendFeedEntry(entry) {
    var container = document.getElementById('feed-entries');
    var div = document.createElement('div');
    div.innerHTML = buildFeedEntryHtml(entry);
    container.appendChild(div.firstElementChild);
    feedEntries.push(entry);
    // If the player has the HANDOUTS tab open, refresh it so new reveals appear immediately
    if (activeTab === 'handouts' && entry.type && entry.type !== 'message') {
      renderHandoutsPanel();
    }
  }

  function prependFeedEntries(entries) {
    var container = document.getElementById('feed-entries');
    var loadWrap  = document.getElementById('feed-load-more-wrap');
    var savedScroll = container.scrollHeight - container.scrollTop;
    entries.forEach(function (entry) {
      var div = document.createElement('div');
      div.innerHTML = buildFeedEntryHtml(entry);
      // Insert after the load-more-wrap (at position 1, not 0)
      container.insertBefore(div.firstElementChild, loadWrap ? loadWrap.nextSibling : container.firstChild);
    });
    container.scrollTop = container.scrollHeight - savedScroll;
  }

  function scrollFeedToBottom() {
    var c = document.getElementById('feed-entries');
    c.scrollTop = c.scrollHeight;
  }

  document.getElementById('feed-entries').addEventListener('scroll', function () {
    var c = this;
    autoScroll = c.scrollTop + c.clientHeight >= c.scrollHeight - 40;
  });

  // ── FEED LOADING ──────────────────────────────────────────────────────────
  function mergeAndSort(rolls, msgs) {
    var all = [];
    (rolls || []).forEach(function (r) { r._type = 'roll'; all.push(r); });
    (msgs  || []).forEach(function (m) { m._type = 'msg';  all.push(m); });
    all.sort(function (a, b) {
      var ta = new Date(((a.rolled_at || a.delivered_at || a.timestamp || '')).replace(' ', 'T')).getTime();
      var tb = new Date(((b.rolled_at || b.delivered_at || b.timestamp || '')).replace(' ', 'T')).getTime();
      return ta - tb;
    });
    return all;
  }

  function initialLoad() {
    Promise.all([
      fetch('/api/v1/rolls?limit=' + FEED_PAGE).then(function (r) { return r.ok ? r.json() : []; }),
      fetch('/api/v1/messages?limit=100').then(function (r) { return r.ok ? r.json() : []; })
    ]).then(function (results) {
      var rolls = results[0].reverse();
      var msgs  = results[1].reverse();

      // Apply clear floor: if a 'clear' sentinel exists, discard everything before it
      var lastClear = null;
      msgs.forEach(function (m) { if (m.type === 'clear') lastClear = m; });
      if (lastClear) {
        var clearTime = new Date((lastClear.delivered_at || '').replace(' ', 'T')).getTime();
        msgs  = msgs.filter(function (m) { return m.id > lastClear.id; });
        rolls = rolls.filter(function (r) {
          var rt = new Date((r.rolled_at || r.timestamp || '').replace(' ', 'T')).getTime();
          return rt > clearTime;
        });
      }

      rolls.forEach(function (r) { if (r.id > lastRollId) lastRollId = r.id; });
      msgs.forEach(function  (m) { if (m.id > lastMsgId)  lastMsgId  = m.id; });

      var combined = mergeAndSort(rolls, msgs);
      combined.forEach(function (e) { appendFeedEntry(e); });
      scrollFeedToBottom();

      feedOffset = rolls.length;
      lastPollTime = Date.now();
      startPolling();
    }).catch(function () { startPolling(); });
  }

  window.loadOlderEntries = function () {
    var btn = document.getElementById('load-more-btn');
    btn.disabled = true;
    btn.textContent = '// LOADING…';
    fetch('/api/v1/rolls?limit=' + FEED_PAGE + '&offset=' + feedOffset)
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (rolls) {
        if (rolls.length === 0) {
          btn.textContent = '↑ NONE OLDER';
          return;
        }
        rolls.reverse();
        rolls.forEach(function (r) { if (r.id > lastRollId) lastRollId = r.id; });
        prependFeedEntries(rolls);
        feedOffset += rolls.length;
        btn.disabled = false;
        btn.textContent = '↑ LOAD EARLIER HISTORY';
      })
      .catch(function () { btn.disabled = false; btn.textContent = '↑ LOAD EARLIER HISTORY'; });
  };

  // ── POLLING ───────────────────────────────────────────────────────────────
  var POLL_ACTIVE  = 6000;   // interval when page is visible
  var POLL_PASSIVE = 60000;  // interval when tab is hidden (CF free-tier budget)
  var lastPollTime = 0;
  var pollInFlight = false;  // guard against concurrent polls (visibilitychange + focus fire together)

  function startPolling() {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(poll, POLL_ACTIVE);
    if (saveTimer) clearInterval(saveTimer);
    saveTimer = setInterval(saveSheet, 5000);
  }

  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    if (saveTimer) { clearInterval(saveTimer); saveTimer = null; }
  }

  // Switches between fast (6s) and slow (60s) polling based on visibility + OS window focus.
  // Called by both visibilitychange and window blur/focus events.
  function updatePollingMode() {
    var active = !document.hidden && document.hasFocus();
    if (pollTimer) clearInterval(pollTimer);
    if (active) {
      if (Date.now() - lastPollTime > POLL_ACTIVE) poll();
      pollTimer = setInterval(poll, POLL_ACTIVE);
    } else {
      pollTimer = setInterval(poll, POLL_PASSIVE);
    }
  }

  document.addEventListener('visibilitychange', updatePollingMode);
  window.addEventListener('blur',  updatePollingMode);
  window.addEventListener('focus', updatePollingMode);

  function poll() {
    if (pollInFlight) return;
    pollInFlight = true;
    lastPollTime = Date.now();
    Promise.all([
      fetch('/api/v1/rolls?after=' + lastRollId).then(function (r) { return r.ok ? r.json() : []; }),
      fetch('/api/v1/messages?after=' + lastMsgId).then(function (r) { return r.ok ? r.json() : []; })
    ]).then(function (results) {
      pollInFlight = false;
      var newRolls = results[0];
      var newMsgs  = results[1];
      newRolls.forEach(function (r) { if (r.id > lastRollId) lastRollId = r.id; });
      newMsgs.forEach(function  (m) { if (m.id > lastMsgId)  lastMsgId  = m.id; });

      // Handle feed-clear signal: if a 'clear' message arrives, wipe the feed
      var clearMsg = newMsgs.filter(function (m) { return m.type === 'clear'; })[0];
      if (clearMsg) {
        feedEntries = [];
        var container = document.getElementById('feed-entries');
        var loadWrap  = document.getElementById('feed-load-more-wrap');
        while (container.lastChild && container.lastChild !== loadWrap) {
          container.removeChild(container.lastChild);
        }
        // Only render messages that arrived strictly after the clear sentinel
        newMsgs  = newMsgs.filter(function (m) { return m.id > clearMsg.id; });
        newRolls = [];
      }

      var combined = mergeAndSort(newRolls, newMsgs);
      combined.forEach(function (e) {
        var alreadyIn = feedEntries.some(function (fe) { return fe._id === e.id && e._type === 'roll'; });
        if (!alreadyIn) appendFeedEntry(e);
      });
      if (combined.length > 0 && autoScroll) scrollFeedToBottom();
    }).catch(function () { pollInFlight = false; });
  }

  // ── HELPERS ───────────────────────────────────────────────────────────────
  function getCurrentSession() {
    return null;
  }

  function escHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── LIGHTBOX ───────────────────────────────────────────────────────────────
  window.openLightbox = function (src, caption) {
    var lb  = document.getElementById('lightbox');
    var img = document.getElementById('lightbox-img');
    var cap = document.getElementById('lightbox-caption');
    img.src     = src;
    cap.textContent = caption || '';
    lb.style.display = 'flex';
    requestAnimationFrame(function () { lb.classList.add('visible'); });
  };
  window.closeLightbox = function () {
    var lb = document.getElementById('lightbox');
    lb.classList.remove('visible');
    setTimeout(function () { lb.style.display = 'none'; }, 150);
  };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeLightbox();
  });

  // ── BOOT ──────────────────────────────────────────────────────────────────
  loadStaticData().then(function () {
    if (hunterId) {
      loadHunterSheet(hunterId).then(function () {
        renderPanel();
        initialLoad();
      });
    } else {
      renderPanel();
      initialLoad();
    }
  });

}());
</script>
</body>
