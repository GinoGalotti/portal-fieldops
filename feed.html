<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P.O.R.T.A.L — Feed</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;400;600;700&family=Barlow:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="player.css">
<style>
/* ── LAYOUT ──────────────────────────────────────────────────────────────── */
body { overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
header { flex-shrink: 0; position: relative; }
.feed-layout {
  display: grid;
  grid-template-columns: 1fr 420px;
  flex: 1;
  min-height: 0;
  gap: 0;
}

/* ── FEED (LEFT) ─────────────────────────────────────────────────────────── */
.feed-col {
  display: flex;
  flex-direction: column;
  min-height: 0;
  border-right: 1px solid var(--border);
}
.feed-header {
  flex-shrink: 0;
  padding: 0.75rem 1rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 0.75rem;
}
.feed-header-label {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.12em;
  color: var(--green-dim);
}

.feed-entries {
  flex: 1;
  overflow-y: auto;
  padding: 0.5rem 0;
  display: flex;
  flex-direction: column;
}

/* "Load earlier" lives at top of the scrollable feed area */
.feed-load-more-wrap {
  display: flex;
  justify-content: center;
  padding: 0.4rem 0;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.feed-load-more {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.6rem;
  color: var(--text-dim);
  background: transparent;
  border: 1px solid var(--border);
  padding: 0.2rem 0.75rem;
  border-radius: 2px;
  cursor: pointer;
  letter-spacing: 0.08em;
  transition: color 0.15s, border-color 0.15s;
}
.feed-load-more:hover { color: var(--green); border-color: var(--green-dim); }
.feed-load-more:disabled { opacity: 0.4; cursor: default; }

/* ── FEED ENTRY ──────────────────────────────────────────────────────────── */
.feed-entry {
  padding: 0.55rem 1rem;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  cursor: default;
  transition: background 0.1s;
  position: relative;
}
.feed-entry:hover { background: rgba(255,255,255,0.02); }
/* Default: click to expand (hover disabled via body.no-hover class added by JS) */
.feed-entry.expanded .feed-outcome-detail { opacity: 1; max-height: 500px; }
body.no-hover .feed-entry:hover .feed-outcome-detail { opacity: 0 !important; max-height: 0 !important; }
/* ?mouseover=true: keep legacy hover behaviour, no .expanded class used */
body:not(.no-hover) .feed-entry:hover .feed-outcome-detail { opacity: 1; max-height: 500px; }

.feed-entry-meta {
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
  margin-bottom: 0.2rem;
}
.feed-hunter-tag {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.08em;
  padding: 0.1rem 0.35rem;
  border-radius: 2px;
  border: 1px solid transparent;
}
.feed-move-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 0.95rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--text-bright);
  text-transform: uppercase;
}
.feed-time {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.55rem;
  color: var(--text-dim);
  margin-left: auto;
}

.feed-roll-line {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  flex-wrap: wrap;
}
.feed-breakdown {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.72rem;
  color: var(--text-dim);
}
.feed-breakdown .die { color: var(--text); }
.feed-breakdown .stat-val { color: var(--green-dim); }
.feed-breakdown .mod-val { color: #7bafd4; }
.feed-breakdown .total { color: var(--text-bright); font-weight: bold; }

.feed-badge {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.1em;
  padding: 0.15rem 0.5rem;
  border-radius: 2px;
  font-weight: bold;
}
.feed-badge.advanced { background: rgba(167,139,250,0.15); color: #a78bfa; border: 1px solid rgba(167,139,250,0.3); }
.feed-badge.hit      { background: rgba(46,204,113,0.15);  color: #2ecc71; border: 1px solid rgba(46,204,113,0.3); }
.feed-badge.partial  { background: rgba(241,196,15,0.12);  color: #f1c40f; border: 1px solid rgba(241,196,15,0.25); }
.feed-badge.miss     { background: rgba(231,76,60,0.12);   color: #e74c3c; border: 1px solid rgba(231,76,60,0.25); }

.feed-outcome-detail {
  margin-top: 0.4rem;
  padding-top: 0.4rem;
  border-top: 1px solid rgba(255,255,255,0.06);
  opacity: 0;
  max-height: 0;
  overflow: hidden;
  transition: opacity 0.2s, max-height 0.3s;
}
.feed-detail-text {
  font-family: 'Barlow', sans-serif;
  font-size: 0.78rem;
  color: var(--text-dim);
  line-height: 1.45;
}
.feed-detail-questions {
  margin-bottom: 0.45rem;
  padding-bottom: 0.4rem;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.feed-detail-qlabel {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.55rem;
  letter-spacing: 0.1em;
  color: var(--text-dim);
  margin-bottom: 0.25rem;
}
.feed-detail-qlist {
  margin: 0;
  padding: 0;
  list-style: none;
}
.feed-detail-qlist li {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.62rem;
  color: var(--text);
  line-height: 1.65;
  padding-left: 0.9rem;
  position: relative;
}
.feed-detail-qlist li::before { content: '·'; position: absolute; left: 0.15rem; color: #3ab5b0; }

/* Message entries */
.feed-entry.msg-entry { border-left: 2px solid var(--green-dim); padding-left: calc(1rem - 2px); }
.feed-msg-sender {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.12em;
  color: var(--green-dim);
  margin-bottom: 0.2rem;
}
.feed-msg-body {
  font-family: 'Barlow', sans-serif;
  font-size: 0.85rem;
  color: var(--text);
  line-height: 1.5;
  white-space: pre-wrap;
}

/* ── READALOUD ENTRIES ───────────────────────────────────────────────────── */
.feed-entry.feed-readaloud {
  border-left: 2px solid var(--green);
  padding: 0.75rem 1rem 0.75rem calc(1rem - 2px);
  background: rgba(46,204,113,0.03);
}
.feed-readaloud-eyebrow {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.55rem;
  letter-spacing: 0.14em;
  color: var(--green-dim);
  margin-bottom: 0.5rem;
  text-transform: uppercase;
}
.feed-readaloud-text {
  font-family: 'Barlow', sans-serif;
  font-style: italic;
  font-size: 0.83rem;
  color: var(--text);
  line-height: 1.7;
  white-space: pre-wrap;
}

/* ── PDA MESSAGE ENTRIES ─────────────────────────────────────────────────── */
.feed-entry.feed-pda {
  padding: 0;
  background: #111108;
  border: 1px solid #3a3a20;
  border-radius: 3px;
  overflow: hidden;
}
.pda-chrome {
  background: #1c1c0e;
  padding: 0.28rem 0.75rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #3a3a20;
}
.pda-chrome-label {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.5rem;
  letter-spacing: 0.18em;
  color: #6a6a40;
}
.pda-chrome-status {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.5rem;
  color: #4a4a30;
  letter-spacing: 0.08em;
}
.pda-body { padding: 0.6rem 0.75rem 0.7rem; }
.pda-header-row {
  display: flex;
  gap: 0.4rem;
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.62rem;
  line-height: 1.7;
  padding-bottom: 0.45rem;
  margin-bottom: 0.45rem;
  border-bottom: 1px solid #2a2a18;
}
.pda-field-label { color: #5a5a38; min-width: 3.5rem; }
.feed-pda.pda-campbell .pda-field-value { color: #4aaa6a; }
.feed-pda.pda-other    .pda-field-value { color: #b89a30; }
.pda-message-text {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.68rem;
  line-height: 1.65;
  white-space: pre-wrap;
}
.feed-pda.pda-campbell .pda-message-text { color: #78c890; }
.feed-pda.pda-other    .pda-message-text { color: #c0a050; }
.pda-footer {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.5rem;
  color: #3a3a22;
  margin-top: 0.5rem;
  padding-top: 0.4rem;
  border-top: 1px solid #2a2a18;
  letter-spacing: 0.1em;
}

/* ── DOCUMENT ENTRIES ───────────────────────────────────────────────────── */
.feed-entry.feed-document { border-left: 2px solid rgba(180,140,80,0.5); background: rgba(15,12,8,0.95); }
.document-chrome {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0.3rem 0.75rem;
  background: rgba(100,70,20,0.3);
  border-bottom: 1px solid rgba(180,140,80,0.2);
}
.document-classification { font-size: 0.65rem; font-family: 'Share Tech Mono', monospace; color: #c8a020; letter-spacing: 0.08em; }
.document-title { padding: 0.5rem 0.75rem 0.2rem; font-size: 0.8rem; font-weight: 700; color: #d4b060; letter-spacing: 0.04em; text-transform: uppercase; }
.document-body { padding: 0.3rem 0.75rem 0.7rem; font-size: 0.75rem; line-height: 1.6; color: #c0a050; white-space: pre-wrap; font-family: 'Share Tech Mono', monospace; }

/* ── CLASSIFIED ENTRIES (keeper view / player redacted) ─────────────────── */
.feed-entry.feed-classified { border-left: 2px solid rgba(160,100,200,0.6); background: rgba(20,10,30,0.95); }
.classified-chrome {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0.3rem 0.75rem;
  background: rgba(80,40,120,0.3);
  border-bottom: 1px solid rgba(160,100,200,0.2);
}
.classified-eyebrow { font-size: 0.65rem; font-family: 'Share Tech Mono', monospace; color: #a060d0; letter-spacing: 0.08em; }
.classified-time { font-size: 0.65rem; font-family: 'Share Tech Mono', monospace; color: #5a3a7a; }
.classified-title { padding: 0.5rem 0.75rem 0.2rem; font-size: 0.8rem; font-weight: 700; color: #c080e0; letter-spacing: 0.04em; text-transform: uppercase; }
.classified-body { padding: 0.3rem 0.75rem 0.7rem; font-size: 0.75rem; line-height: 1.6; color: #b090d0; white-space: pre-wrap; font-family: 'Share Tech Mono', monospace; }
.feed-entry.feed-redacted { border-left: 2px solid rgba(60,60,60,0.5); background: rgba(10,10,10,0.95); }
.redacted-chrome {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0.3rem 0.75rem;
  background: rgba(25,25,25,0.8);
  border-bottom: 1px solid rgba(60,60,60,0.3);
}
.redacted-label { font-size: 0.65rem; font-family: 'Share Tech Mono', monospace; color: #383838; letter-spacing: 0.08em; }
.redacted-body { padding: 0.6rem 0.75rem 0.7rem; display: flex; flex-direction: column; gap: 0.4rem; }
.redacted-bar { height: 0.65rem; background: #1e1e1e; border-radius: 2px; }
.redacted-bar:nth-child(1) { width: 82%; }
.redacted-bar:nth-child(2) { width: 64%; }
.redacted-bar:nth-child(3) { width: 74%; }
.redacted-footer { font-size: 0.6rem; color: #2a2a2a; letter-spacing: 0.12em; text-align: center; padding-top: 0.3rem; font-family: 'Share Tech Mono', monospace; }

/* ── IMAGE / MAP ENTRIES ─────────────────────────────────────────────────── */
.feed-entry.feed-image {
  padding: 0.6rem 1rem;
}
.feed-image-card { position: relative; cursor: zoom-in; }
.feed-image-card img {
  width: 100%;
  display: block;
  border-radius: 2px;
  border: 1px solid var(--border);
}
.feed-image-label {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.58rem;
  color: var(--text-dim);
  letter-spacing: 0.06em;
  margin-top: 0.4rem;
}
.feed-image-type-tag {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.5rem;
  letter-spacing: 0.12em;
  color: var(--text-dim);
  opacity: 0.5;
  margin-bottom: 0.35rem;
}

/* ── LIGHTBOX ────────────────────────────────────────────────────────────── */
.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  cursor: zoom-out;
  opacity: 0;
  transition: opacity 0.15s;
}
.lightbox.visible { opacity: 1; }
.lightbox img {
  max-width: 92vw;
  max-height: 90vh;
  object-fit: contain;
  border-radius: 2px;
  box-shadow: 0 0 60px rgba(0,0,0,0.8);
}
.lightbox-caption {
  position: absolute;
  bottom: 1.5rem;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.65rem;
  color: rgba(255,255,255,0.4);
  letter-spacing: 0.08em;
  white-space: nowrap;
}

/* ── KEEPER HANDOUT BUTTONS ──────────────────────────────────────────────── */
.handout-list { display: flex; flex-direction: column; gap: 0.4rem; padding: 0.5rem 0; }
.handout-item {
  display: flex;
  align-items: flex-start;
  gap: 0.5rem;
  padding: 0.5rem 0.6rem;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: rgba(255,255,255,0.02);
}
.handout-item.posted { opacity: 0.5; border-color: rgba(46,204,113,0.2); }
.handout-type-pip {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.5rem;
  letter-spacing: 0.1em;
  padding: 0.15rem 0.4rem;
  border-radius: 2px;
  flex-shrink: 0;
  margin-top: 0.1rem;
  text-transform: uppercase;
}
.pip-readaloud { background: rgba(46,204,113,0.12); color: var(--green-dim); border: 1px solid rgba(46,204,113,0.2); }
.pip-pda        { background: rgba(200,160,32,0.12); color: #c8a020; border: 1px solid rgba(200,160,32,0.2); }
.pip-image      { background: rgba(100,140,255,0.1); color: #7a9bff; border: 1px solid rgba(100,140,255,0.2); }
.pip-map        { background: rgba(180,100,255,0.1); color: #c07aff; border: 1px solid rgba(180,100,255,0.2); }
.pip-document   { background: rgba(180,140,32,0.12); color: #c8a020; border: 1px solid rgba(180,140,32,0.2); }
.pip-classified { background: rgba(160,100,200,0.12); color: #a060d0; border: 1px solid rgba(160,100,200,0.2); }
.handout-meta  { flex: 1; min-width: 0; }
.handout-label {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.65rem;
  color: var(--text);
  margin-bottom: 0.15rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.handout-posted-time {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.52rem;
  color: var(--green-dim);
  letter-spacing: 0.06em;
}
.handout-post-btn {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.08em;
  padding: 0.25rem 0.55rem;
  border-radius: 2px;
  cursor: pointer;
  flex-shrink: 0;
  transition: background 0.15s;
  background: rgba(46,204,113,0.08);
  border: 1px solid rgba(46,204,113,0.25);
  color: var(--green);
}
.handout-post-btn:hover { background: rgba(46,204,113,0.16); }
.handout-post-btn.repost {
  background: rgba(255,255,255,0.04);
  border-color: var(--border);
  color: var(--text-dim);
}
.handout-post-btn.repost:hover { background: rgba(255,255,255,0.08); }

/* ── PLAYER HANDOUTS PANEL ───────────────────────────────────────────────── */
.handout-panel-tabs {
  display: flex;
  gap: 0.3rem;
  margin-bottom: 0.75rem;
  flex-wrap: wrap;
}
.handout-panel-tab {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.08em;
  padding: 0.2rem 0.55rem;
  border-radius: 2px;
  cursor: pointer;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  transition: all 0.15s;
}
.handout-panel-tab.active {
  background: rgba(46,204,113,0.1);
  border-color: rgba(46,204,113,0.35);
  color: var(--green);
}
.handout-gallery {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 0.5rem;
}
.handout-gallery-item { cursor: zoom-in; }
.handout-gallery-item img {
  width: 100%;
  border-radius: 2px;
  border: 1px solid var(--border);
  display: block;
}
.handout-gallery-label {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.52rem;
  color: var(--text-dim);
  letter-spacing: 0.05em;
  margin-top: 0.2rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
/* ── KEEPER HANDOUT MAP NOTE + CLEAR BUTTON ──────────────────────────────── */
.handout-map-note {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.52rem;
  color: #c07aff;
  letter-spacing: 0.06em;
  margin-top: 0.15rem;
}
.handout-clear-btn {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.08em;
  padding: 0.3rem 0.55rem;
  border-radius: 2px;
  cursor: pointer;
  background: rgba(231,76,60,0.06);
  border: 1px solid rgba(231,76,60,0.2);
  color: #e74c3c;
  transition: background 0.15s;
  width: 100%;
  margin-top: 0.6rem;
}
.handout-clear-btn:hover { background: rgba(231,76,60,0.12); }

/* ── FEED COMPOSER ───────────────────────────────────────────────────────── */
.feed-composer {
  flex-shrink: 0;
  display: flex;
  gap: 0.4rem;
  padding: 0.5rem 0.75rem;
  border-top: 1px solid var(--border);
  background: rgba(0,0,0,0.1);
}
.composer-name {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.68rem;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
  padding: 0.3rem 0.5rem;
  border-radius: 3px;
  width: 110px;
  flex-shrink: 0;
}
.composer-msg {
  font-family: 'Barlow', sans-serif;
  font-size: 0.82rem;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
  padding: 0.3rem 0.5rem;
  border-radius: 3px;
  flex: 1;
}
.composer-name:focus, .composer-msg:focus { outline: none; border-color: var(--green-dim); }
.composer-send {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.8rem;
  color: var(--green);
  background: rgba(46,204,113,0.08);
  border: 1px solid rgba(46,204,113,0.25);
  padding: 0.3rem 0.65rem;
  border-radius: 3px;
  cursor: pointer;
  flex-shrink: 0;
  transition: background 0.15s;
}
.composer-send:hover { background: rgba(46,204,113,0.15); }

/* ── RIGHT PANEL ─────────────────────────────────────────────────────────── */
.panel-col {
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--card-bg);
}
.panel-header {
  flex-shrink: 0;
  padding: 0.75rem 1rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 0.6rem;
}
.hunter-select {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.72rem;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
  padding: 0.3rem 0.5rem;
  border-radius: 3px;
  flex: 1;
  cursor: pointer;
}
.hunter-select:focus { outline: none; border-color: var(--green-dim); }
.hunter-select option { background: #0d1a13; }

.panel-tabs {
  flex-shrink: 0;
  display: flex;
  border-bottom: 1px solid var(--border);
}
.panel-tab {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.62rem;
  letter-spacing: 0.08em;
  padding: 0.5rem 0.85rem;
  background: transparent;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color 0.15s, border-color 0.15s;
}
.panel-tab:hover { color: var(--text); }
.panel-tab.active { color: var(--green); border-bottom-color: var(--green); }

.panel-body {
  flex: 1;
  overflow-y: auto;
  padding: 0.75rem 1rem;
}

/* ── MOVE CARDS ──────────────────────────────────────────────────────────── */
.move-section-label {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.12em;
  color: var(--green-dim);
  padding: 0.5rem 0 0.35rem;
  border-bottom: 1px solid var(--border);
  margin-bottom: 0.4rem;
}
.move-section-label:first-child { padding-top: 0; }

.move-card {
  border: 1px solid var(--border);
  border-radius: 4px;
  margin-bottom: 0.4rem;
  overflow: hidden;
  transition: border-color 0.15s;
}
.move-card:hover { border-color: var(--green-dim); }

.move-card-top {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.45rem 0.65rem;
  user-select: none;
}
.move-card-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 0.9rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--text-bright);
  text-transform: uppercase;
  flex: 1;
}
.move-card-roll {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.6rem;
  color: var(--green-dim);
  background: rgba(46,204,113,0.07);
  border: 1px solid rgba(46,204,113,0.15);
  padding: 0.1rem 0.35rem;
  border-radius: 2px;
  white-space: nowrap;
}
.move-card-roll.passive {
  color: var(--text-dim);
  background: transparent;
  border-color: var(--border);
}

/* Move description — shown on hover */
.move-desc {
  display: none;
  padding: 0.5rem 0.65rem 0.6rem;
  border-top: 1px solid var(--border);
  background: rgba(0,0,0,0.12);
}
.move-card:hover .move-desc { display: block; }
.move-desc-trigger {
  font-family: 'Barlow', sans-serif;
  font-size: 0.75rem;
  color: var(--text-dim);
  font-style: italic;
  margin-bottom: 0.45rem;
  line-height: 1.45;
}
.move-desc-text {
  font-family: 'Barlow', sans-serif;
  font-size: 0.75rem;
  color: var(--text-dim);
  line-height: 1.5;
}
.move-outcomes { display: flex; flex-direction: column; gap: 0.25rem; }
.move-outcome { display: flex; gap: 0.5rem; align-items: baseline; }
.outcome-label {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.55rem;
  letter-spacing: 0.07em;
  white-space: nowrap;
  padding: 0.1rem 0.3rem;
  border-radius: 2px;
  flex-shrink: 0;
  min-width: 3.8rem;
  text-align: center;
}
.outcome-label.adv     { color: #f0a500; background: rgba(240,165,0,0.1);   border: 1px solid rgba(240,165,0,0.25); }
.outcome-label.hit     { color: #3ab5b0; background: rgba(58,181,176,0.08); border: 1px solid rgba(58,181,176,0.2); }
.outcome-label.partial { color: #a3a3a3; background: rgba(163,163,163,0.07); border: 1px solid rgba(163,163,163,0.18); }
.outcome-label.miss    { color: #f87171; background: rgba(248,113,113,0.08); border: 1px solid rgba(248,113,113,0.2); }
.outcome-text {
  font-family: 'Barlow', sans-serif;
  font-size: 0.73rem;
  color: var(--text-dim);
  line-height: 1.45;
}
.move-questions { margin-top: 0.5rem; }
.move-questions-label { font-family: 'Share Tech Mono', monospace; font-size: 0.55rem; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 0.25rem; }

/* Roll UI — always visible for rollable moves */
.move-roll-ui {
  display: flex;
  padding: 0.4rem 0.65rem 0.55rem;
  border-top: 1px solid var(--border);
  background: rgba(0,0,0,0.15);
  gap: 0.5rem;
  align-items: center;
}
.mod-label {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.6rem;
  color: var(--text-dim);
  white-space: nowrap;
}
.mod-input {
  width: 52px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.8rem;
  background: var(--input-bg, rgba(0,0,0,0.3));
  border: 1px solid var(--border);
  color: var(--text-bright);
  padding: 0.2rem 0.4rem;
  border-radius: 3px;
  text-align: center;
}
.mod-input:focus { outline: none; border-color: var(--green); }
.roll-btn {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.08em;
  color: var(--green);
  background: rgba(46,204,113,0.08);
  border: 1px solid rgba(46,204,113,0.3);
  padding: 0.25rem 0.7rem;
  border-radius: 3px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.roll-btn:hover { background: rgba(46,204,113,0.15); border-color: var(--green); }
.roll-btn.rolling-anim { opacity: 0.6; }

/* Stats bar */
.stats-bar {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
  margin-bottom: 0.85rem;
}
.stat-chip {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.62rem;
  letter-spacing: 0.06em;
  padding: 0.2rem 0.5rem;
  border-radius: 3px;
  border: 1px solid var(--border);
  color: var(--text-dim);
}
.stat-chip strong { color: var(--text-bright); }

/* Harm / Luck / XP mini-track */
.track-mini { display: flex; align-items: center; gap: 0.35rem; margin-bottom: 0.5rem; }
.track-mini-label { font-family: 'Share Tech Mono', monospace; font-size: 0.6rem; color: var(--text-dim); width: 2.5rem; }
.track-mini-pips { display: flex; gap: 3px; }
.track-mini-pip {
  width: 10px; height: 10px; border-radius: 50%;
  border: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.1s, border-color 0.1s;
}
.track-mini-pip:hover { border-color: var(--text-dim); }
.track-mini-pip.on-harm    { background: #e74c3c; border-color: #e74c3c; }
.track-mini-pip.on-luck    { background: var(--green-dim); border-color: var(--green); }
.track-mini-pip.on-xp      { background: #7bafd4; border-color: #5a9ab5; }
.track-bump {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.7rem;
  color: var(--text-dim);
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 2px;
  width: 16px; height: 16px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  line-height: 1;
  padding: 0;
}
.track-bump:hover { color: var(--text); border-color: var(--text-dim); }
.xp-overflow {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.6rem;
  color: #7bafd4;
  background: rgba(123,175,212,0.1);
  border: 1px solid rgba(123,175,212,0.25);
  padding: 0.1rem 0.3rem;
  border-radius: 2px;
}

/* Contacts tab */
.contact-card {
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 0.55rem 0.75rem;
  margin-bottom: 0.4rem;
  cursor: default;
}
.contact-card:not(.keeper-contact-card):hover { border-color: rgba(58,181,176,0.4); }
.contact-name { font-family: 'Barlow Condensed', sans-serif; font-size: 0.95rem; font-weight: 600; color: var(--text-bright); text-transform: uppercase; letter-spacing: 0.04em; }
.contact-role { font-family: 'Share Tech Mono', monospace; font-size: 0.58rem; color: var(--text-dim); margin: 0.1rem 0 0.3rem; }
.contact-desc { font-family: 'Barlow', sans-serif; font-size: 0.8rem; color: var(--text); line-height: 1.45; }
.contact-note {
  margin-top: 0.4rem;
  padding: 0.3rem 0.5rem;
  border-left: 2px solid rgba(58,181,176,0.5);
  font-family: 'Barlow', sans-serif;
  font-size: 0.75rem;
  color: var(--text-dim);
  font-style: italic;
  white-space: pre-wrap;
}
.contact-note-hint {
  margin-top: 0.35rem;
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.55rem;
  color: rgba(58,181,176,0.35);
  letter-spacing: 0.06em;
}
.contact-note-editor {
  margin-top: 0.4rem;
  width: 100%;
  background: rgba(0,0,0,0.3);
  border: 1px solid rgba(58,181,176,0.4);
  border-radius: 3px;
  color: var(--text);
  font-family: 'Barlow', sans-serif;
  font-size: 0.78rem;
  padding: 0.3rem 0.4rem;
  resize: vertical;
  min-height: 3.5rem;
  box-sizing: border-box;
}
.contact-note-editor:focus { outline: none; border-color: rgba(58,181,176,0.7); }
.contact-note-actions { display: flex; gap: 0.4rem; margin-top: 0.3rem; }
.contact-note-save, .contact-note-cancel {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.58rem;
  padding: 0.2rem 0.5rem;
  border-radius: 3px;
  border: 1px solid;
  cursor: pointer;
  background: none;
  letter-spacing: 0.06em;
}
.contact-note-save   { border-color: rgba(58,181,176,0.6); color: #3ab5b0; }
.contact-note-save:hover { background: rgba(58,181,176,0.15); }
.contact-note-cancel { border-color: var(--border); color: var(--text-dim); }
.contact-note-cancel:hover { background: rgba(255,255,255,0.05); }

/* Keeper mode */
.keeper-active .feed-header-label::after { content: ' [KEEPER]'; color: #a78bfa; }
/* Hide player controls in keeper mode */
.keeper-active .panel-header { display: none; }
.keeper-active .panel-tabs   { display: none; }
/* Show keeper controls only in keeper mode */
.keeper-mode-header { display: none; flex-shrink: 0; padding: 0.55rem 1rem; border-bottom: 1px solid var(--border); background: rgba(167,139,250,0.04); align-items: center; gap: 0.5rem; }
.keeper-active .keeper-mode-header { display: flex; }
.keeper-mode-label { font-family: 'Share Tech Mono', monospace; font-size: 0.6rem; letter-spacing: 0.12em; color: #a78bfa; flex: 1; }
.keeper-mode-tabs { display: none; flex-shrink: 0; border-bottom: 1px solid var(--border); }
.keeper-active .keeper-mode-tabs { display: flex; }
.keeper-tab {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.62rem;
  letter-spacing: 0.08em;
  padding: 0.5rem 0.85rem;
  background: transparent;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color 0.15s, border-color 0.15s;
}
.keeper-tab:hover { color: var(--text); }
.keeper-tab.active { color: #a78bfa; border-bottom-color: #a78bfa; }

/* Keeper operative pills */
.keeper-ops-row { display: flex; gap: 0.3rem; flex-wrap: wrap; margin-bottom: 0.85rem; }
.keeper-op-btn {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.6rem;
  padding: 0.25rem 0.6rem;
  border: 1px solid var(--border);
  border-radius: 2px;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
}
.keeper-op-btn:hover { color: var(--text); border-color: var(--text-dim); }
.keeper-op-btn.active { color: #a78bfa; border-color: #a78bfa; background: rgba(167,139,250,0.06); }

/* Session filter pills */
.session-filter { display: flex; gap: 0.3rem; margin-bottom: 0.85rem; }
.session-pill {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.6rem;
  padding: 0.2rem 0.55rem;
  border: 1px solid var(--border);
  border-radius: 2px;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
}
.session-pill:hover { color: var(--text); border-color: var(--text-dim); }
.session-pill.active { color: #a78bfa; border-color: #a78bfa; background: rgba(167,139,250,0.06); }

/* NPC row in keeper contacts */
.npc-row {
  border: 1px solid var(--border);
  border-radius: 4px;
  margin-bottom: 0.5rem;
  overflow: hidden;
}
.npc-row-head {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.45rem 0.65rem;
}
.npc-row-name { font-family: 'Barlow Condensed', sans-serif; font-size: 0.9rem; font-weight: 600; color: var(--text-bright); text-transform: uppercase; letter-spacing: 0.04em; flex: 1; }
.npc-row-role { font-family: 'Share Tech Mono', monospace; font-size: 0.55rem; color: var(--text-dim); }
.npc-vis-btn {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.55rem;
  letter-spacing: 0.06em;
  padding: 0.15rem 0.4rem;
  border-radius: 2px;
  border: 1px solid transparent;
  cursor: pointer;
  background: transparent;
  white-space: nowrap;
  transition: color 0.15s, border-color 0.15s;
}
.npc-vis-btn.visible  { color: var(--green); border-color: rgba(46,204,113,0.3); }
.npc-vis-btn.hidden   { color: var(--text-dim); border-color: var(--border); }
.npc-vis-btn:hover    { opacity: 0.8; }
.npc-row-desc {
  font-family: 'Barlow', sans-serif;
  font-size: 0.78rem;
  color: var(--text-dim);
  line-height: 1.45;
  padding: 0 0.65rem 0.55rem;
  border-top: 1px solid rgba(255,255,255,0.04);
  padding-top: 0.4rem;
}

/* Keeper references */
.ref-section { margin-bottom: 1.1rem; }
.ref-label { font-family: 'Share Tech Mono', monospace; font-size: 0.6rem; letter-spacing: 0.12em; color: #a78bfa; margin-bottom: 0.4rem; padding-bottom: 0.3rem; border-bottom: 1px solid var(--border); }
.ref-row { font-family: 'Share Tech Mono', monospace; font-size: 0.65rem; color: var(--text-dim); line-height: 1.7; }
.ref-row strong { color: var(--text); }
.ref-list { margin: 0; padding: 0; list-style: none; }
.ref-list li { font-family: 'Share Tech Mono', monospace; font-size: 0.63rem; color: var(--text-dim); line-height: 1.65; padding-left: 0.9rem; position: relative; }
.ref-list li::before { content: '·'; position: absolute; left: 0.1rem; color: #a78bfa; }
.ref-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1rem; }
.ref-note { font-family: 'Barlow', sans-serif; font-size: 0.72rem; color: var(--text-dim); font-style: italic; margin-top: 0.3rem; line-height: 1.45; }

/* Data tab */
.data-session-selector { display: flex; gap: 0.4rem; margin-bottom: 1rem; flex-wrap: wrap; }
.data-sess-btn {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.62rem;
  letter-spacing: 0.08em;
  padding: 0.25rem 0.6rem;
  border-radius: 3px;
  border: 1px solid var(--border);
  background: none;
  color: var(--text-dim);
  cursor: pointer;
}
.data-sess-btn:hover { color: var(--text); border-color: rgba(167,139,250,0.5); }
.data-sess-btn.active { color: #a78bfa; border-color: #a78bfa; background: rgba(167,139,250,0.08); }
.data-entity-block { border-left: 2px solid rgba(167,139,250,0.3); padding-left: 0.7rem; }
.data-entity-desc { font-family: 'Barlow', sans-serif; font-size: 0.78rem; color: var(--text-dim); line-height: 1.5; margin-bottom: 0.5rem; }
.data-stat-row { font-family: 'Share Tech Mono', monospace; font-size: 0.63rem; color: var(--text); margin-bottom: 0.35rem; }
.data-stat-label { font-family: 'Share Tech Mono', monospace; font-size: 0.58rem; letter-spacing: 0.08em; color: #a78bfa; }
.data-field { font-family: 'Share Tech Mono', monospace; font-size: 0.63rem; color: var(--text-dim); line-height: 1.55; }
.data-readaloud {
  font-family: 'Barlow', sans-serif;
  font-size: 0.8rem;
  color: var(--text);
  line-height: 1.6;
  font-style: italic;
  background: rgba(167,139,250,0.05);
  border-left: 2px solid rgba(167,139,250,0.4);
  padding: 0.5rem 0.7rem;
  white-space: pre-wrap;
}
.data-threat-block { border-left: 2px solid rgba(248,113,113,0.35); padding-left: 0.7rem; }
.data-threat-type { font-family: 'Share Tech Mono', monospace; font-size: 0.6rem; letter-spacing: 0.08em; color: #f87171; margin-bottom: 0.25rem; }
.data-equip-block { margin-bottom: 0.75rem; padding-left: 0.7rem; border-left: 1px solid var(--border); }
.data-equip-block:last-child { margin-bottom: 0; }
.data-equip-name { font-family: 'Barlow Condensed', sans-serif; font-size: 0.85rem; font-weight: 600; color: var(--text-bright); text-transform: uppercase; letter-spacing: 0.04em; }
.data-equip-sub { font-family: 'Share Tech Mono', monospace; font-size: 0.55rem; color: var(--text-dim); font-weight: 400; text-transform: none; letter-spacing: 0.02em; }

.keeper-panel-note {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.65rem;
  color: var(--text-dim);
  padding: 1rem 0;
  text-align: center;
}

/* Keeper message composer */
.msg-composer { margin-top: 1rem; border-top: 1px solid var(--border); padding-top: 0.75rem; }
.msg-composer-label { font-family: 'Share Tech Mono', monospace; font-size: 0.6rem; color: var(--green-dim); margin-bottom: 0.4rem; letter-spacing: 0.1em; }
.msg-sender-select, .msg-textarea {
  width: 100%;
  background: var(--input-bg, rgba(0,0,0,0.3));
  border: 1px solid var(--border);
  color: var(--text);
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.75rem;
  padding: 0.4rem 0.6rem;
  border-radius: 3px;
  box-sizing: border-box;
  margin-bottom: 0.4rem;
}
.msg-sender-select:focus, .msg-textarea:focus { outline: none; border-color: var(--green-dim); }
.msg-textarea { resize: vertical; min-height: 70px; font-family: 'Barlow', sans-serif; font-size: 0.82rem; }
.msg-send-btn {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.65rem;
  color: #a78bfa;
  background: rgba(167,139,250,0.07);
  border: 1px solid rgba(167,139,250,0.3);
  padding: 0.35rem 0.85rem;
  border-radius: 3px;
  cursor: pointer;
  letter-spacing: 0.08em;
  transition: background 0.15s;
}
.msg-send-btn:hover { background: rgba(167,139,250,0.14); }
</style>

<body>

<header>
  <a href="index.html" class="logo">P<span>.</span>O<span>.</span>R<span>.</span>T<span>.</span>A<span>.</span>L</a>
  <nav id="player-nav"></nav>
  <script src="player-nav.js"></script>
</header>

<div class="feed-layout">

  <!-- ── LEFT: FEED ── -->
  <div class="feed-col">
    <div class="feed-header">
      <span class="feed-header-label">// OPERATIONS FEED</span>
    </div>
    <div class="feed-entries" id="feed-entries">
      <!-- "load earlier" at top of scroll area — click to page back in history -->
      <div class="feed-load-more-wrap">
        <button class="feed-load-more" id="load-more-btn" onclick="loadOlderEntries()">↑ LOAD EARLIER HISTORY</button>
      </div>
      <!-- entries injected here, oldest at top newest at bottom -->
    </div>
    <!-- anyone can post a message -->
    <div class="feed-composer">
      <input type="text" class="composer-name" id="composer-name" placeholder="Name…" maxlength="40">
      <input type="text" class="composer-msg" id="composer-msg" placeholder="Write something to the feed…">
      <button class="composer-send" onclick="sendFeedMessage()">↵</button>
    </div>
  </div>

  <!-- ── RIGHT: PANEL ── -->
  <div class="panel-col">
    <!-- Player controls (hidden in keeper mode) -->
    <div class="panel-header">
      <select class="hunter-select" id="hunter-select" onchange="onHunterChange(this.value)">
        <option value="">— Select operative —</option>
        <option value="rex">Rex Bangley</option>
        <option value="reed">Reed Atwood</option>
        <option value="alan">Alan Frazier</option>
        <option value="sven">Sven</option>
        <option value="john-johnson">John Johnson</option>
      </select>
    </div>
    <div class="panel-tabs" id="panel-tabs">
      <button class="panel-tab active" data-tab="moves" onclick="switchTab('moves')">// MOVES</button>
      <button class="panel-tab" data-tab="contacts" onclick="switchTab('contacts')">// CONTACTS</button>
      <button class="panel-tab" data-tab="handouts" onclick="switchTab('handouts')">// HANDOUTS</button>
    </div>

    <!-- Keeper controls (hidden unless keeper-active) -->
    <div class="keeper-mode-header">
      <span class="keeper-mode-label">// KEEPER COMMAND</span>
    </div>
    <div class="keeper-mode-tabs" id="keeper-mode-tabs">
      <button class="keeper-tab active" data-ktab="operatives" onclick="switchKeeperTab('operatives')">// OPERATIVES</button>
      <button class="keeper-tab" data-ktab="contacts" onclick="switchKeeperTab('contacts')">// CONTACTS</button>
      <button class="keeper-tab" data-ktab="references" onclick="switchKeeperTab('references')">// REFERENCES</button>
      <button class="keeper-tab" data-ktab="threats" onclick="switchKeeperTab('threats')">// THREATS</button>
      <button class="keeper-tab" data-ktab="handouts" onclick="switchKeeperTab('handouts')">// HANDOUTS</button>
    </div>

    <div class="panel-body" id="panel-body">
      <div style="font-family:'Share Tech Mono',monospace;font-size:0.7rem;color:var(--text-dim);padding:2rem 0;text-align:center">
        // SELECT OPERATIVE TO LOAD MOVES
      </div>
    </div>
  </div>

</div>

<!-- Lightbox overlay — shown when any image/map handout is clicked -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightbox-img" src="" alt="">
  <div class="lightbox-caption" id="lightbox-caption"></div>
</div>

<script>
(function () {

  // ── STATE ─────────────────────────────────────────────────────────────────
  var hunterId       = null;
  var hunterSheet    = null;
  var playbook_moves = null;
  var basic_moves    = null;
  var npcs_data      = null;
  var entities_data  = null;
  var session_data   = null;
  var keeperDataSession = null;   // currently selected session in THREATS tab
  var activeTab      = 'moves';
  var keeperMode          = false;
  var keeperClicks        = 0;
  var keeperTimer         = null;
  var keeperViewHunter    = null;
  var keeperTab           = 'operatives';  // 'operatives' | 'contacts' | 'references'
  var keeperSessionFilter = 'S02';         // 'S01' | 'S02' | 'ALL'
  var npcVisibilityOverrides = {};         // { npc_id: bool } — loaded from localStorage
  var contactNotes = {};                   // { npc_id: string } — loaded from localStorage

  var feedEntries    = [];   // combined rolls + messages, sorted by timestamp
  var lastRollId     = 0;
  var lastMsgId      = 0;
  var feedOffset     = 0;
  var FEED_PAGE      = 200;
  var pollTimer      = null;
  var saveTimer      = null;
  var sheetDirty     = false;
  var autoScroll     = true;

  // Expand-on-click mode (default). ?mouseover=true restores legacy hover behaviour.
  var hoverMode = new URLSearchParams(location.search).get('mouseover') === 'true';
  if (!hoverMode) document.body.classList.add('no-hover');

  // Click anywhere on a feed entry (not on a button) to toggle expanded detail
  document.getElementById('feed-entries').addEventListener('click', function (e) {
    if (hoverMode) return;
    if (e.target.closest('button')) return;
    var entry = e.target.closest('.feed-entry');
    if (!entry) return;
    entry.classList.toggle('expanded');
  });

  var HUNTER_NAMES  = { rex: 'Rex Bangley', reed: 'Reed Atwood', alan: 'Alan Frazier', sven: 'Sven', 'john-johnson': 'John Johnson' };
  var HUNTER_COLORS = { rex: '#f0a500', reed: '#3ab5b0', alan: '#3ab5b0', sven: '#a78bfa', 'john-johnson': '#c8ddd0' };
  var STAT_NAMES    = { charm: 'CHM', cool: 'COL', sharp: 'SHP', tough: 'TGH', weird: 'WRD' };

  // ── KEEPER TOGGLE ─────────────────────────────────────────────────────────
  document.querySelector('.logo').addEventListener('click', function (e) {
    e.preventDefault();
    keeperClicks++;
    clearTimeout(keeperTimer);
    keeperTimer = setTimeout(function () { keeperClicks = 0; }, 1500);
    if (keeperClicks >= 5) {
      keeperClicks = 0;
      keeperMode = !keeperMode;
      document.body.classList.toggle('keeper-active', keeperMode);
      if (keeperMode) {
        // Sync keeper tab UI state
        document.querySelectorAll('.keeper-tab').forEach(function (btn) {
          btn.classList.toggle('active', btn.dataset.ktab === keeperTab);
        });
      }
      renderPanel();
    }
  });

  // ── HUNTER SELECTION ─────────────────────────────────────────────────────
  try {
    var saved = localStorage.getItem('portal_feed_hunter');
    if (saved) {
      document.getElementById('hunter-select').value = saved;
      hunterId = saved;
      var nameEl = document.getElementById('composer-name');
      if (nameEl && saved) nameEl.value = HUNTER_NAMES[saved] || '';
    }
    var savedVis = localStorage.getItem('portal_npc_visibility');
    if (savedVis) npcVisibilityOverrides = JSON.parse(savedVis);
    var savedNotes = localStorage.getItem('portal_contact_notes');
    if (savedNotes) contactNotes = JSON.parse(savedNotes);
  } catch (e) {}

  window.onHunterChange = function (id) {
    hunterId = id || null;
    try { if (id) localStorage.setItem('portal_feed_hunter', id); } catch (e) {}
    var nameEl = document.getElementById('composer-name');
    if (nameEl) nameEl.value = id ? (HUNTER_NAMES[id] || '') : '';
    hunterSheet = null;
    if (id) loadHunterSheet(id).then(renderPanel);
    else renderPanel();
  };

  function loadHunterSheet(id) {
    return fetch('/api/v1/hunters/' + id + '/sheet')
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        hunterSheet = (data && Object.keys(data).length > 0) ? data : null;
      })
      .catch(function () { hunterSheet = null; });
  }

  // ── DATA LOADING ──────────────────────────────────────────────────────────
  function loadStaticData() {
    return Promise.all([
      fetch('/data/playbook-moves.json').then(function (r) { return r.ok ? r.json() : null; }),
      fetch('/data/motw-basic-moves.json').then(function (r) { return r.ok ? r.json() : null; }),
      fetch('/data/portal-npcs.json').then(function (r) { return r.ok ? r.json() : null; }),
      fetch('/data/portal-entities.json').then(function (r) { return r.ok ? r.json() : null; }),
      fetch('/data/session-data.json').then(function (r) { return r.ok ? r.json() : null; })
    ]).then(function (results) {
      playbook_moves = results[0];
      basic_moves    = results[1];
      npcs_data      = results[2];
      entities_data  = results[3];
      session_data   = results[4];
    });
  }

  // ── TAB SWITCHING ─────────────────────────────────────────────────────────
  window.switchTab = function (tab) {
    activeTab = tab;
    document.querySelectorAll('.panel-tab').forEach(function (btn) {
      btn.classList.toggle('active', btn.dataset.tab === tab);
    });
    renderPanel();
  };

  // ── PANEL RENDER ──────────────────────────────────────────────────────────
  function renderPanel() {
    if (keeperMode) { renderKeeperPanel(); return; }
    if (activeTab === 'moves')    renderMovesPanel();
    if (activeTab === 'contacts') renderContactsPanel();
    if (activeTab === 'handouts') renderHandoutsPanel();
  }

  // ── MOVES PANEL ───────────────────────────────────────────────────────────
  function renderMovesPanel() {
    var body = document.getElementById('panel-body');
    if (!hunterId) {
      body.innerHTML = '<div style="font-family:\'Share Tech Mono\',monospace;font-size:0.7rem;color:var(--text-dim);padding:2rem 0;text-align:center">// SELECT OPERATIVE TO LOAD MOVES</div>';
      return;
    }

    var html = '';

    // Stats + tracks
    if (hunterSheet && hunterSheet.stats) {
      html += '<div class="stats-bar">';
      ['charm','cool','sharp','tough','weird'].forEach(function (s) {
        var v = hunterSheet.stats[s];
        if (v === undefined || v === null || v === '') return;
        var val = parseInt(v, 10);
        var str = (val > 0 ? '+' : '') + val;
        html += '<div class="stat-chip">' + STAT_NAMES[s] + ' <strong>' + str + '</strong></div>';
      });
      html += '</div>';

      // Clickable harm / luck / xp tracks
      html += renderTrack('harm', 7, 'on-harm', hunterSheet.harm || 0, false);
      html += renderTrack('luck', 7, 'on-luck', hunterSheet.luck || 0, false);
      html += renderTrack('xp',   5, 'on-xp',   hunterSheet.xp  || 0, true);
      html += '<div style="margin-bottom:0.75rem"></div>';
    }

    // Always-active moves (e.g. Violence for Rex)
    if (playbook_moves && playbook_moves.always_active_moves && playbook_moves.always_active_moves[hunterId]) {
      var always = playbook_moves.always_active_moves[hunterId];
      if (always.length > 0) {
        html += '<div class="move-section-label">// ALWAYS ACTIVE</div>';
        always.forEach(function (m) { html += renderMoveCard(m); });
      }
    }

    // Playbook moves (checked in D1)
    if (playbook_moves && hunterSheet && hunterSheet.checks) {
      var checks = hunterSheet.checks;
      var active = Object.keys(checks).filter(function (k) {
        return checks[k] === true && playbook_moves.moves[k] && playbook_moves.moves[k].hunter === hunterId;
      });
      if (active.length > 0) {
        html += '<div class="move-section-label">// PLAYBOOK MOVES</div>';
        active.forEach(function (k) { html += renderMoveCard(playbook_moves.moves[k], k); });
      }
    }

    // Basic moves
    if (basic_moves && basic_moves.basic_moves) {
      html += '<div class="move-section-label">// BASIC MOVES</div>';
      basic_moves.basic_moves.forEach(function (m) {
        if (!m.roll) return; // skip passive
        html += renderMoveCard({
          name: m.name,
          roll: '+' + m.roll.charAt(0).toUpperCase() + m.roll.slice(1),
          description: m.trigger,
          outcomes: m.outcomes,
          _basic_id: m.id
        }, m.id);
      });
    }

    body.innerHTML = html;
    wireMoveCards(body);
  }

  // ── TRACK RENDERING ───────────────────────────────────────────────────────
  function renderTrack(name, max, cls, value, showBump) {
    var display  = Math.min(value, max);
    var overflow = value > max ? value - max : 0;
    var html = '<div class="track-mini"><span class="track-mini-label">' + name.toUpperCase() + '</span><div class="track-mini-pips">';
    for (var i = 0; i < max; i++) {
      html += '<div class="track-mini-pip' + (i < display ? ' ' + cls : '') +
        '" onclick="setTrack(\'' + name + '\',' + i + ')"></div>';
    }
    html += '</div>';
    if (showBump) {
      html += '<button class="track-bump" onclick="bumpTrack(\'' + name + '\')">+</button>';
    }
    if (overflow > 0) {
      html += '<span class="xp-overflow">+' + overflow + '</span>';
    }
    html += '</div>';
    return html;
  }

  window.setTrack = function (name, pipIndex) {
    if (!hunterId || !hunterSheet) return;
    var current = hunterSheet[name] || 0;
    hunterSheet[name] = current > pipIndex ? pipIndex : pipIndex + 1;
    sheetDirty = true;
    renderMovesPanel();
  };

  window.bumpTrack = function (name) {
    if (!hunterId || !hunterSheet) return;
    hunterSheet[name] = (hunterSheet[name] || 0) + 1;
    sheetDirty = true;
    renderMovesPanel();
  };

  function saveSheet() {
    if (!hunterId || !hunterSheet || !sheetDirty) return;
    sheetDirty = false; // clear before fetch; re-set on failure
    fetch('/api/v1/hunters/' + hunterId + '/sheet', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(hunterSheet)
    }).catch(function () { sheetDirty = true; });
  }

  // ── MOVE CARDS ────────────────────────────────────────────────────────────
  function renderMoveCard(move, key) {
    var hasRoll = move.roll && move.roll !== null;
    var rollBadge = hasRoll
      ? '<span class="move-card-roll">' + move.roll + '</span>'
      : '<span class="move-card-roll passive">PASSIVE</span>';
    var cardKey = key || move.id || move.name.replace(/\s+/g,'-').toLowerCase();

    var rollUi = hasRoll ? (
      '<div class="move-roll-ui">' +
        '<span class="mod-label">mod</span>' +
        '<input class="mod-input" type="number" value="0" min="-9" max="9">' +
        '<button class="roll-btn" onclick="doRoll(this)">// ROLL</button>' +
      '</div>'
    ) : '';

    // ── Description block ──
    var descHtml = '';
    var o = move.outcomes;   // structured outcomes (basic moves)
    var d = move.description; // free-text description (playbook moves)

    if (o && (o['12_plus'] || o['10_plus'] || o['7_9'] || o.miss)) {
      // Basic move: trigger + structured outcomes
      if (move.trigger || d) {
        descHtml += '<div class="move-desc-trigger">' + escHtml(move.trigger || d) + '</div>';
      }
      // Custom thresholds: 12_plus→ADV(13+), 10_plus→HIT(11–12), 7_9→PARTIAL(7–10), miss→FAILURE(6–)
      var rows = [
        { cls: 'adv',     label: '⚡ 13+',    text: o['12_plus'] },
        { cls: 'hit',     label: '✓ 11–12',  text: o['10_plus'] },
        { cls: 'partial', label: '~ 7–10',   text: o['7_9']     },
        { cls: 'miss',    label: '✗ 6–',     text: o.miss       }
      ];
      descHtml += '<div class="move-outcomes">';
      rows.forEach(function (r) {
        if (!r.text) return;
        descHtml += '<div class="move-outcome">' +
          '<span class="outcome-label ' + r.cls + '">' + r.label + '</span>' +
          '<span class="outcome-text">' + escHtml(r.text) + '</span>' +
        '</div>';
      });
      descHtml += '</div>';
      // Questions list (Investigate a Mystery, Read a Bad Situation)
      if (o.questions && o.questions.length) {
        descHtml += '<div class="move-questions">' +
          '<div class="move-questions-label">// QUESTIONS</div>' +
          '<ul class="ref-list">';
        o.questions.forEach(function (q) { descHtml += '<li>' + escHtml(q) + '</li>'; });
        descHtml += '</ul></div>';
      }
    } else if (d) {
      // Playbook / always-active move: free-text description covers everything
      descHtml = '<div class="move-desc-text">' + escHtml(d) + '</div>';
    }

    var descBlock = descHtml ? '<div class="move-desc">' + descHtml + '</div>' : '';

    return '<div class="move-card" data-move-key="' + cardKey + '" data-move-name="' + escHtml(move.name) + '" data-roll="' + (move.roll||'') + '">' +
      '<div class="move-card-top">' +
        '<span class="move-card-name">' + escHtml(move.name) + '</span>' +
        rollBadge +
      '</div>' +
      rollUi +
      descBlock +
    '</div>';
  }

  function wireMoveCards(container) {
    container.querySelectorAll('.move-card').forEach(function (card) {
      var inp = card.querySelector('.mod-input');
      if (inp) inp.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') card.querySelector('.roll-btn').click();
      });
    });
  }

  window.doRoll = function (btn) {
    var card     = btn.closest('.move-card');
    var moveName = card.dataset.moveName;
    var rollStat = card.dataset.roll; // e.g. "+Sharp"
    var modifier = parseInt(card.querySelector('.mod-input').value, 10) || 0;

    // Determine stat value from sheet
    var statKey = rollStat ? rollStat.replace(/[+-]/g, '').toLowerCase() : null;
    var statVal = 0;
    if (statKey && hunterSheet && hunterSheet.stats && hunterSheet.stats[statKey] !== undefined) {
      statVal = parseInt(hunterSheet.stats[statKey], 10) || 0;
    }

    // Find outcomes for hover display
    var outcomeData = findOutcomes(card.dataset.moveKey);

    // Roll
    var d1    = Math.ceil(Math.random() * 6);
    var d2    = Math.ceil(Math.random() * 6);
    var total = d1 + d2 + statVal + modifier;

    // Custom thresholds: 13+ advanced, 11-12 success, 7-10 partial, 6- failure
    var outcome = total >= 13 ? 'advanced' : total >= 11 ? 'hit' : total >= 7 ? 'partial' : 'miss';

    // Brief animate
    btn.textContent = d1 + ' + ' + d2 + '…';
    btn.classList.add('rolling-anim');

    setTimeout(function () {
      btn.textContent = '// ROLL';
      btn.classList.remove('rolling-anim');
      // Reset modifier to 0 after rolling
      card.querySelector('.mod-input').value = '0';

      // Build feed entry locally
      var entry = {
        _local: true,
        hunter_id: hunterId,
        move_name: moveName,
        stat_used: statKey,
        stat_val: statVal,
        roll_1: d1,
        roll_2: d2,
        modifier: modifier,
        total: total,
        outcome: outcome,
        outcomes: outcomeData,
        timestamp: new Date().toISOString()
      };
      appendFeedEntry(entry);
      scrollFeedToBottom();

      // POST to D1
      var session = getCurrentSession();
      fetch('/api/v1/rolls', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          hunter_id: hunterId,
          session:   session,
          move_name: moveName,
          stat_used: statKey,
          roll_1:    d1,
          roll_2:    d2,
          modifier:  modifier,
          total:     total
        })
      }).then(function (r) { return r.json(); })
        .then(function (data) {
          if (data.id) entry._id = data.id;
          if (data.id > lastRollId) lastRollId = data.id;
        })
        .catch(function () {});
    }, 350);
  };

  function findOutcomes(moveKey) {
    // Check always_active_moves — may have a basic_move_ref to delegate to
    if (playbook_moves && playbook_moves.always_active_moves) {
      for (var h in playbook_moves.always_active_moves) {
        var list = playbook_moves.always_active_moves[h];
        for (var i = 0; i < list.length; i++) {
          if (list[i].id === moveKey) {
            if (list[i].basic_move_ref) {
              return findBasicMoveOutcomes(list[i].basic_move_ref);
            }
            return null;
          }
        }
      }
    }
    // Check playbook moves — no structured outcomes
    if (playbook_moves && playbook_moves.moves && playbook_moves.moves[moveKey]) {
      return null;
    }
    // Check basic moves by id
    return findBasicMoveOutcomes(moveKey);
  }

  function findBasicMoveOutcomes(id) {
    if (!basic_moves || !basic_moves.basic_moves) return null;
    var bm = basic_moves.basic_moves.filter(function (m) { return m.id === id; })[0];
    return (bm && bm.outcomes) ? bm.outcomes : null;
  }

  // ── CONTACTS PANEL ────────────────────────────────────────────────────────
  function renderContactsPanel() {
    var body = document.getElementById('panel-body');
    if (!npcs_data) { body.innerHTML = '<div class="keeper-panel-note">// LOADING…</div>'; return; }

    var visible = npcs_data.npcs.filter(function (n) {
      return keeperMode || n.visible_to_players;
    });

    if (visible.length === 0) { body.innerHTML = '<div class="keeper-panel-note">// NO CONTACTS CLEARED FOR DISPLAY</div>'; return; }

    var groups = {};
    visible.forEach(function (n) {
      var a = n.affiliation || 'unknown';
      if (!groups[a]) groups[a] = [];
      groups[a].push(n);
    });

    var html = '';
    ['PORTAL','civilian','MESA','unknown'].forEach(function (affil) {
      if (!groups[affil]) return;
      html += '<div class="move-section-label">// ' + affil.toUpperCase() + '</div>';
      var hunterNotes = !keeperMode ? getHunterNotes() : {};
      groups[affil].forEach(function (n) {
        var note = hunterNotes[n.id] || '';
        var noteHtml = note
          ? '<div class="contact-note">' + escHtml(note) + '</div>'
          : (!keeperMode && hunterId ? '<div class="contact-note-hint">// double-click to add a note</div>' : '');
        var dblclick = (!keeperMode && hunterId) ? ' ondblclick="openContactNoteEditor(\'' + escHtml(n.id) + '\')"' : '';
        html += '<div class="contact-card" id="cc-' + escHtml(n.id) + '"' + dblclick + '>' +
          '<div class="contact-name">' + escHtml(n.name) + '</div>' +
          '<div class="contact-role">' + escHtml(n.role) + '</div>' +
          '<div class="contact-desc">' + escHtml(keeperMode && n.keeper_description ? n.keeper_description : n.player_description) + '</div>' +
          noteHtml +
        '</div>';
      });
    });
    body.innerHTML = html;
  }

  // ── CONTACT NOTE EDITOR ───────────────────────────────────────────────────
  // contactNotes shape: { hunter_id: { npc_id: "text" } }
  function getHunterNotes() {
    if (!hunterId) return {};
    return contactNotes[hunterId] || {};
  }
  function persistContactNotes() {
    try { localStorage.setItem('portal_contact_notes', JSON.stringify(contactNotes)); } catch (e) {}
  }

  window.openContactNoteEditor = function (npcId) {
    if (!hunterId) return; // must have a hunter selected to take notes
    var card = document.getElementById('cc-' + npcId);
    if (!card) return;
    // Remove any existing editor in other cards
    document.querySelectorAll('.contact-note-editor-wrap').forEach(function (el) { el.remove(); });
    // Remove hint/existing note display temporarily
    card.querySelectorAll('.contact-note, .contact-note-hint').forEach(function (el) { el.remove(); });

    var existing = getHunterNotes()[npcId] || '';
    var wrap = document.createElement('div');
    wrap.className = 'contact-note-editor-wrap';
    wrap.innerHTML =
      '<textarea class="contact-note-editor" id="cne-' + npcId + '" placeholder="Personal note…">' + escHtml(existing) + '</textarea>' +
      '<div class="contact-note-actions">' +
        '<button class="contact-note-save" onclick="saveContactNote(\'' + npcId + '\')">SAVE</button>' +
        '<button class="contact-note-cancel" onclick="cancelContactNote(\'' + npcId + '\')">CANCEL</button>' +
        (existing ? '<button class="contact-note-cancel" onclick="deleteContactNote(\'' + npcId + '\')" style="margin-left:auto;color:#f87171;border-color:rgba(248,113,113,0.4)">CLEAR</button>' : '') +
      '</div>';
    card.appendChild(wrap);
    var ta = document.getElementById('cne-' + npcId);
    if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
    wrap.ondblclick = function (e) { e.stopPropagation(); };
  };

  window.saveContactNote = function (npcId) {
    if (!hunterId) return;
    var ta = document.getElementById('cne-' + npcId);
    if (!ta) return;
    var val = ta.value.trim();
    if (!contactNotes[hunterId]) contactNotes[hunterId] = {};
    if (val) contactNotes[hunterId][npcId] = val;
    else delete contactNotes[hunterId][npcId];
    persistContactNotes();
    renderContactsPanel();
  };

  window.cancelContactNote = function (npcId) {
    renderContactsPanel();
  };

  window.deleteContactNote = function (npcId) {
    if (!hunterId) return;
    if (contactNotes[hunterId]) delete contactNotes[hunterId][npcId];
    persistContactNotes();
    renderContactsPanel();
  };

  // ── PLAYER HANDOUTS PANEL ─────────────────────────────────────────────────
  // Shows keeper-shared images as a gallery, filtered by session tab.
  // Readalouds and PDAs are feed-only — not shown here.
  // Deduplicates: same image posted twice appears once.
  var playerHandoutSession = null;

  window.switchPlayerHandoutSession = function (id) {
    playerHandoutSession = id;
    renderHandoutsPanel();
  };

  function renderHandoutsPanel() {
    var body = document.getElementById('panel-body');
    if (!session_data) { body.innerHTML = '<div class="keeper-panel-note">// LOADING…</div>'; return; }

    // Default to last session
    if (!playerHandoutSession) playerHandoutSession = session_data[session_data.length - 1].id;

    // Session tabs
    var html = '<div class="handout-panel-tabs">';
    session_data.forEach(function (s) {
      var active = s.id === playerHandoutSession ? ' active' : '';
      html += '<button class="handout-panel-tab' + active + '" onclick="switchPlayerHandoutSession(\'' + s.id + '\')">' + escHtml(s.session_key) + '</button>';
    });
    html += '</div>';

    var sess = session_data.filter(function (s) { return s.id === playerHandoutSession; })[0];
    var sessKey = sess ? sess.session_key : null;

    // Images/maps only, matching session, dedup by src
    var seen = {};
    var images = feedEntries.filter(function (e) {
      if (e.type !== 'image' && e.type !== 'map') return false;
      if (sessKey && e.session_id !== sessKey) return false;
      var p = {};
      try { p = typeof e.payload === 'string' ? JSON.parse(e.payload) : (e.payload || {}); } catch (x) {}
      var src = p.src || '';
      if (!src || seen[src]) return false;
      seen[src] = true;
      return true;
    });

    if (images.length === 0) {
      body.innerHTML = html + '<div class="keeper-panel-note">// NO IMAGES SHARED YET</div>';
      return;
    }

    html += '<div class="handout-gallery">';
    images.forEach(function (e) {
      var p = {};
      try { p = typeof e.payload === 'string' ? JSON.parse(e.payload) : (e.payload || {}); } catch (x) {}
      var src   = p.src || '';
      var label = p.label || e.subject || '';
      html += '<div class="handout-gallery-item" onclick="openLightbox(\'' + escHtml(src) + '\',\'' + escHtml(label) + '\')">' +
        '<img src="' + escHtml(src) + '" alt="' + escHtml(label) + '">' +
        (label ? '<div class="handout-gallery-label">' + escHtml(label) + '</div>' : '') +
      '</div>';
    });
    html += '</div>';
    body.innerHTML = html;
  }

  // ── KEEPER HANDOUTS TAB ───────────────────────────────────────────────────
  // Shows all handouts defined for the selected session, with POST buttons.
  // Posted handouts are tracked in localStorage; readalouds can be re-posted.
  var keeperHandoutSession = null;

  window.keeperSelectHandoutSession = function (id) {
    keeperHandoutSession = id;
    renderKeeperHandoutsTab();
  };

  function renderKeeperHandoutsTab() {
    var body = document.getElementById('panel-body');
    if (!session_data) { body.innerHTML = '<div class="keeper-panel-note">// LOADING…</div>'; return; }
    if (!keeperHandoutSession) keeperHandoutSession = session_data[session_data.length - 1].id;

    // Session selector
    var html = '<div class="data-session-selector">';
    session_data.forEach(function (s) {
      var active = s.id === keeperHandoutSession ? ' active' : '';
      html += '<button class="data-sess-btn' + active + '" onclick="keeperSelectHandoutSession(\'' + s.id + '\')">' + escHtml(s.session_key) + '</button>';
    });
    html += '</div>';

    var sess = session_data.filter(function (s) { return s.id === keeperHandoutSession; })[0];

      body.innerHTML = html + '<div class="keeper-panel-note">// NO HANDOUTS FOR THIS SESSION</div>';

    }

    var posted = {};
    try { posted = JSON.parse(localStorage.getItem('portal_posted_handouts') || '{}'); } catch (x) {}

    html += '<div class="handout-list">';

      var isPosted = !!posted[h.id];

      var typeLabel = h.type.toUpperCase();
      var itemClass = isPosted ? 'handout-item posted' : 'handout-item';

        // Maps: no POST button — interactive maps not yet implemented
        html += '<div class="' + itemClass + '">' +

        var btnClass = isPosted ? 'handout-post-btn repost' : 'handout-post-btn';

          '<button class="' + btnClass + '" id="hbtn-' + escHtml(h.id) + '" onclick="postHandout(\'' + escHtml(h.id) + '\')">' + btnLabel + '</button>' +

  window.clearSessionHandouts = function () {
    var sess = session_data ? session_data.filter(function (s) { return s.id === keeperHandoutSession; })[0] : null;
    if (!sess) return;

    // Clear localStorage and re-render immediately — no waiting for D1
    var posted = {};
    try { posted = JSON.parse(localStorage.getItem('portal_posted_handouts') || '{}'); } catch (x) {}
    (sess.handouts || []).forEach(function (h) { delete posted[h.id]; });
    localStorage.setItem('portal_posted_handouts', JSON.stringify(posted));
    // Remove handout entries from local cache and DOM for this session
    feedEntries = feedEntries.filter(function (e) {
      return !(e.session_id === sess.session_key && e.type && e.type !== 'message');
    });
    var feedContainer = document.getElementById('feed-entries');
    feedContainer.querySelectorAll('.feed-readaloud, .feed-pda, .feed-image, .feed-document, .feed-classified, .feed-redacted').forEach(function (el) {
      el.remove();
    });
    renderKeeperHandoutsTab();
    // Refresh player gallery if open
    if (activeTab === 'handouts') renderHandoutsPanel();

    // Also delete from D1 in background (ensures cleared state survives reload)
    fetch('/api/v1/messages?session_id=' + encodeURIComponent(sess.session_key), {
      method: 'DELETE'
    }).then(function (r) { return r.json(); })
      .catch(function (err) { console.error('clearSessionHandouts D1 delete failed', err); });
  };

  window.postHandout = function (handoutId) {
    var sess = session_data ? session_data.filter(function (s) { return s.id === keeperHandoutSession; })[0] : null;
    if (!sess) return;
    var h = (sess.handouts || []).filter(function (x) { return x.id === handoutId; })[0];
    if (!h) return;
    var bodyText = h.text || h.body || h.label || '';
    fetch('/api/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        session_id: sess ? sess.session_key : null,
        sender:     h.from || 'KEEPER',
        subject:    h.label || h.subject || null,
        body:       bodyText,
        type:       h.type,
        payload:    h
      })
    }).then(function (r) { return r.json(); }).then(function (res) {
      if (!res.ok) {
        console.error('postHandout failed', res);
        var errBtn = document.getElementById('hbtn-' + handoutId);
        if (errBtn) { errBtn.textContent = 'ERR'; errBtn.style.color = '#e74c3c'; }
        return;
      }
      var posted = {};
      try { posted = JSON.parse(localStorage.getItem('portal_posted_handouts') || '{}'); } catch (x) {}
      var now = new Date();
      posted[h.id] = now.getHours() + ':' + String(now.getMinutes()).padStart(2,'0');
      localStorage.setItem('portal_posted_handouts', JSON.stringify(posted));
      renderKeeperHandoutsTab();
    }).catch(function (err) {
      console.error('postHandout error', err);
      var errBtn = document.getElementById('hbtn-' + handoutId);
      if (errBtn) { errBtn.textContent = 'ERR'; errBtn.style.color = '#e74c3c'; }
    });
  };

          e.resolution_conditions.forEach(function (r) { html += '<li>' + escHtml(r) + '</li>'; });
